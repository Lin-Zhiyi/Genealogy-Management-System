<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 族谱管理系统</title>
  <style>
    body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #e8e8e8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: #fff; padding: 30px 40px; border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); width: 320px; }
    h2 { text-align: center; margin-bottom: 20px; color: #0078d4; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; color: #444; }
    input { width: 100%; padding: 10px; border: 1px solid #c0c0c0; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #0078d4; color: #fff; border: none; border-radius: 5px; font-size: 14px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #0066b8; }
    .error { color: #c42b1c; font-size: 13px; margin-top: 10px; text-align: center; }
    .link { text-align: center; margin-top: 15px; font-size: 13px; }
    .link a { color: #0078d4; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🔐 族谱管理</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit">登 录</button>
    </form>
    <div class="error" id="errorMessage"></div>
    <div class="link">
      没有账号？<a href="/register.html">注册新用户</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || '/';
          window.location.replace(redirect);   // 仅修改此处：使用 replace 避免重定向循环
        } else {
          const data = await res.json();
          errorDiv.textContent = data.error || '登录失败';
        }
      } catch (err) {
        errorDiv.textContent = '网络错误，请稍后再试';
      }
    });
  </script>
</body>
</html>
