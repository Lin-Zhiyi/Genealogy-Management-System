<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>族谱管理系统</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-menu: #f2f2f2;
      --bg-status: #f0f0f0;
      --bg-main: #ffffff;
      --bg-tree: #ffffff;
      --border-color: #c8c8c8;
      --highlight-bg: #0078d4;
      --highlight-text: #ffffff;
      --hover-bg: #e8f0fe;
      --danger-bg: #c42b1c;
      --font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      --font-mono: 'Cascadia Code', 'Consolas', monospace;
      --color-self: #0078d4;
      --color-other: #27ae60;
      --color-spouse: #e67e22;
      --org-line-color: #b0b8c8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-family);
      font-size: 13px;
      background: #e8e8e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      padding: 10px;
      overflow-y: auto;
      overflow-x: auto;
    }
    .app-window {
      width: 100%;
      max-width: none;
      min-height: 92vh;
      background: var(--bg-main);
      border: 1px solid #999;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      position: relative;
    }
    .title-bar {
      background: linear-gradient(180deg, #fafafa 0%, #e8e8e8 100%);
      border-bottom: 1px solid #c0c0c0;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: #333;
      flex-shrink: 0;
    }
    .app-icon { width: 20px; height: 20px; background: #0078d4; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; }
    .app-title { flex: 1; }
    .app-version { font-size: 11px; font-weight: 400; color: #888; margin-left: 8px; }
    .user-area { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 12px; font-weight: 400; }
    .user-area .username { color: #0078d4; font-weight: 600; white-space: nowrap; }
    .user-area button { padding: 3px 10px; border: 1px solid #c0c0c0; border-radius: 4px; background: #f5f5f5; cursor: pointer; font-size: 11px; white-space: nowrap; }
    .user-area button:hover { background: #e0e0e0; }
    .user-area .btn-logout { color: #c42b1c; border-color: #d08078; }
    .menu-bar {
      background: var(--bg-menu);
      border-bottom: 1px solid #d0d0d0;
      padding: 3px 6px;
      display: flex;
      gap: 2px;
      flex-shrink: 0;
      flex-wrap: wrap;
      align-items: center;
    }
    .menu-item { padding: 5px 13px; cursor: pointer; border-radius: 4px; font-size: 12.5px; color: #333; position: relative; }
    .menu-item:hover { background: #dce4f0; }
    .separator { width: 1px; background: #c8c8c8; margin: 3px 6px; align-self: stretch; }
    .dropdown-menu {
      position: absolute; top: 100%; left: 0; background: #fafafa; border: 1px solid #b0b0b0;
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; min-width: 200px;
      padding: 4px 0; display: none;
    }
    .dropdown-menu.show { display: block; }
    .dm-item { padding: 7px 20px; cursor: pointer; font-size: 12.5px; color: #333; display: flex; align-items: center; gap: 8px; }
    .dm-item:hover { background: #e0e8f4; }
    .dm-item.danger { color: #c42b1c; }
    .toolbar {
      background: #f7f7f7; border-bottom: 1px solid #d8d8d8; padding: 5px 10px;
      display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; align-items: center;
    }
    .toolbar button {
      padding: 6px 14px; border: 1px solid #c0c0c0; border-radius: 5px; background: #f5f5f5;
      cursor: pointer; font-size: 12px;
    }
    .toolbar button:hover { background: #e8ecf2; }
    .toolbar button.primary { background: #0078d4; color: #fff; border-color: #0066b8; }
    .toolbar button.danger { background: #fff; color: #c42b1c; border-color: #d08078; }
    .tb-separator { width: 1px; background: #d0d0d0; margin: 2px 4px; align-self: stretch; }
    .family-selector { padding: 4px 8px; border: 1px solid #c0c0c0; border-radius: 4px; font-size: 12px; background: #fff; cursor: pointer; }
    .main-body { display: flex; flex: 1; overflow: auto; position: relative; min-height: 0; }
    .sash { width: 5px; background: #e0e0e0; cursor: col-resize; flex-shrink: 0; transition: background 0.15s; }
    .sash:hover, .sash.active { background: #0078d4; }
    .tree-panel { background: var(--bg-tree); overflow: auto; flex-shrink: 0; min-width: 180px; padding: 6px 0; }

    .tree-node {
      cursor: pointer; white-space: nowrap; padding: 4px 8px 4px 4px; margin: 1px 2px;
      border-radius: 4px; display: flex; align-items: center; gap: 4px; font-size: 13px;
      width: max-content;
      min-width: calc(100% - 4px);
      box-sizing: border-box;
    }
    .tree-node:hover { background: var(--hover-bg); }
    .tree-node.selected {
      background: var(--highlight-bg);
      color: var(--highlight-text);
    }

    .tree-arrow { width: 16px; height: 16px; font-size: 9px; display: inline-flex; align-items: center; justify-content: center; color: #555; }
    .tree-arrow.expanded { transform: rotate(90deg); }
    .tree-arrow.no-children { visibility: hidden; }
    .tree-icon { width: 18px; height: 18px; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
    .tree-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .detail-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fafafa; min-width: 300px; }
    .detail-header {
      background: #f5f5f5; border-bottom: 1px solid #d8d8d8; padding: 10px 14px;
      font-size: 13px; font-weight: 600; color: #444; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .key-icon { font-size: 16px; }
    .key-path { color: #888; font-size: 11.5px; font-family: var(--font-mono); flex: 1; }
    .tab-bar { display: flex; background: #f5f5f5; border-bottom: 1px solid #d8d8d8; padding: 0 10px; flex-shrink: 0; }
    .tab-btn {
      padding: 9px 18px; cursor: pointer; border: none; background: transparent; font-size: 12.5px;
      color: #666; border-bottom: 3px solid transparent; transition: all 0.15s; margin-bottom: -1px;
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .tab-btn:hover { color: #333; background: #eef2f7; }
    .tab-btn.active { color: #0078d4; border-bottom-color: #0078d4; font-weight: 600; background: #fafafa; }
    .tab-content { flex: 1; overflow: auto; display: none; padding: 4px; }
    .tab-content.active { display: flex; flex-direction: column; }
    .attr-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .attr-table th { background: #f0f0f0; border: 1px solid #d0d0d0; padding: 8px 12px; text-align: left; font-weight: 600; position: sticky; top: 0; }
    .attr-table td { border: 1px solid #e0e0e0; padding: 7px 12px; color: #333; }
    .col-name { font-family: var(--font-mono); font-weight: 500; width: 35%; }
    .col-data { width: 65%; cursor: pointer; }
    .col-data input, .col-data textarea, .col-data select {
      width: 100%; padding: 6px 8px; border: 2px solid #0078d4; border-radius: 4px; font-size: 12.5px; font-family: var(--font-family);
    }
    .col-data textarea { resize: vertical; min-height: 60px; }
    .child-link { color: #0078d4; cursor: pointer; text-decoration: underline; margin-right: 4px; }
    .child-link:hover { color: #005a9e; }
    .sort-btn { margin-left: 8px; cursor: pointer; color: #0078d4; font-size: 12px; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #aaa; gap: 8px; }
    .org-chart {
      flex: 1; overflow: auto; padding: 20px 30px; display: flex;
      justify-content: flex-start; align-items: flex-start; background: #ffffff; border-radius: 6px;
      touch-action: pan-x pan-y pinch-zoom;
    }
    .org-tree {
      display: inline-flex; flex-direction: column; align-items: center;
      min-width: max-content; transform-origin: top left; transition: transform 0.2s ease; background: #ffffff;
    }
    .org-node {
      display: flex; flex-direction: column; align-items: center; padding: 12px 20px;
      border-radius: 12px; cursor: pointer; min-width: 100px; text-align: center;
      border: 2px solid transparent; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      background: #fff; position: relative; z-index: 2; margin: 4px 8px; white-space: nowrap;
    }
    .org-node:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
    .org-node.node-self { border-color: var(--color-self); background: #e8f4fd; }
    .org-node.node-other { border-color: var(--color-other); background: #f4fdf7; }
    .org-node.node-spouse { border-color: var(--color-spouse); background: #fef5e7; }
    .org-node .node-name { font-weight: 600; font-size: 13px; }
    .org-node .node-years { font-size: 9px; color: #aaa; }
    .org-children { display: flex; justify-content: center; position: relative; padding-top: 30px; }
    .org-node.has-children::after {
      content: ''; position: absolute; bottom: -18px; left: 50%;
      width: 2px; height: 18px; background: var(--org-line-color); z-index: 1;
    }
    .org-children.multiple::before {
      content: ''; position: absolute; top: 10px; left: 0; right: 0;
      height: 2px; background: var(--org-line-color); z-index: 1;
    }
    .org-branch { position: relative; display: flex; flex-direction: column; align-items: center; }
    .org-branch::before {
      content: ''; position: absolute; top: -20px; left: 50%;
      width: 2px; height: 20px; background: var(--org-line-color); z-index: 1;
    }
    .spouse-pair { display: flex; align-items: center; gap: 4px; position: relative; }
    .spouse-pair::after {
      content: ''; position: absolute; top: 50%; left: 0; right: 0;
      height: 2px; background: var(--color-spouse); z-index: 1;
    }
    .sibling-row {
      display: flex; justify-content: center; align-items: center; gap: 16px;
      flex-wrap: wrap; padding: 10px 0; flex-direction: row-reverse;
    }
    .view-mode-bar {
      display: flex; gap: 6px; align-items: center; padding: 8px 12px;
      background: #f0f3f7; border-bottom: 1px solid #d8d8d8; flex-shrink: 0; flex-wrap: wrap; justify-content: space-between;
    }
    .view-mode-bar button {
      padding: 4px 12px; border: 1px solid #b0b0b0; border-radius: 14px;
      background: #fff; cursor: pointer; font-size: 11px; transition: all 0.12s; white-space: nowrap;
    }
    .view-mode-bar button.active { background: #0078d4; color: #fff; border-color: #0066b8; font-weight: 500; }
    .graph-legend {
      display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
      padding: 10px 14px; border-top: 1px solid #e8e8e8; background: #fafafa; font-size: 11px; color: #666; flex-shrink: 0;
    }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 4px; vertical-align: middle; }
    .status-bar {
      background: #f0f0f0; border-top: 1px solid #d0d0d0; padding: 5px 14px;
      display: flex; align-items: center; gap: 16px; font-size: 11.5px; color: #666; flex-shrink: 0;
    }
    .status-path {
      flex: 1;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .status-count { flex-shrink: 0; }
    .copyright-bar {
      background: #e8e8e8; border-top: 1px solid #d0d0d0; padding: 5px 14px;
      font-size: 10.5px; color: #888; display: flex; justify-content: center; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .context-menu {
      position: fixed; background: #fafafa; border: 1px solid #b0b0b0;
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 2000; min-width: 200px; padding: 4px 0; display: none;
    }
    .context-menu.show { display: block; }
    .cm-item { padding: 8px 18px; cursor: pointer; font-size: 12.5px; color: #333; display: flex; align-items: center; gap: 9px; }
    .cm-item:hover { background: #e0e8f4; }
    .cm-item.danger { color: #c42b1c; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 3000; display: flex; align-items: center; justify-content: center; }
    .modal-dialog {
      background: #fafafa; border: 1px solid #999; border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3); width: 500px; max-width: 95vw; max-height: 80vh; display: flex; flex-direction: column;
    }
    .modal-header { background: #f0f0f0; border-bottom: 1px solid #d0d0d0; padding: 12px 18px; font-weight: 600; }
    .modal-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
    .modal-footer { background: #f5f5f5; border-top: 1px solid #d8d8d8; padding: 12px 18px; display: flex; justify-content: flex-end; gap: 8px; }
    .btn-primary { background: #0078d4; color: #fff; border-color: #0066b8; }
    .btn-cancel { background: #e8e8e8; color: #333; }
    .undo-bar, .info-bar {
      position: absolute; top: 0; left: 0; right: 0; background: #fff3cd;
      border-bottom: 1px solid #ffc107; padding: 8px 14px; display: flex; align-items: center;
      gap: 10px; font-size: 12px; color: #856404; z-index: 10;
    }
    .undo-bar button, .info-bar button {
      background: #0078d4; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: auto;
    }
    body.mobile-layout .main-body { flex-direction: column; }
    body.mobile-layout .tree-panel { max-height: 35vh; }
    body.mobile-layout .sash { display: none; }
    .sort-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #eee; }
    .sort-item span { flex: 1; }
    .sort-item button { padding: 2px 8px; margin-left: 4px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 12px; color: #444; }
  </style>
</head>
<body>
<div class="app-window" id="appWindow">
  <div class="title-bar">
    <div class="app-icon">林</div>
    <span class="app-title">族谱管理系统 <span class="app-version">v1.0</span></span>
    <div class="user-area" id="userArea">
      <span class="username" id="usernameDisplay">未登录</span>
      <button onclick="changePassword()">修改密码</button>
      <button class="btn-logout" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="menu-bar">
    <div class="menu-item" data-menu="file" id="menuFile">文件
      <div class="dropdown-menu" id="dropdownFile">
        <div class="dm-item" onclick="exportData()">📤 导出所有家族</div>
        <div class="dm-item" onclick="importData()">📥 导入</div>
        <div class="dm-item" onclick="syncNow()">☁️ 上传到云端</div>
        <div class="dm-item" onclick="loadFromCloud()">☁️ 从云端加载</div>
        <div class="dm-item danger" onclick="deleteAllData()">🗑️ 删除所有数据</div>
      </div>
    </div>
    <div class="menu-item" data-menu="edit" id="menuEdit">编辑
      <div class="dropdown-menu" id="dropdownEdit">
        <div class="dm-item" onclick="addChildMember()">➕ 添加子成员</div>
        <div class="dm-item" onclick="addSiblingMember()">👥 添加兄弟</div>
        <div class="dm-item" onclick="addAttribute()">📝 添加信息</div>
        <div class="dm-item danger" onclick="deleteSelectedMember()">🗑️ 删除成员</div>
      </div>
    </div>
    <div class="menu-item" id="menuSearch" onclick="openSearchDialog()">🔍 搜索</div>
    <span class="separator"></span>
    <div class="menu-item" onclick="openFamilyManageDialog()">👨‍👩‍👧‍👦 家族管理</div>
    <div class="menu-item" id="menuAdmin" onclick="openAdminDialog()" style="display:none;">👥 用户管理</div>
    <div class="menu-item" onclick="showHelp()">帮助</div>
    <div class="menu-item" id="menuBackup" onclick="openBackupDialog()">💾 备份管理</div>
  </div>
  <div class="toolbar">
    <select class="family-selector" id="familySelector" onchange="switchFamily(this.value)"></select>
    <span class="tb-separator"></span>
    <button id="btnPreface" onclick="openPrefaceDialog()">📜 序言</button>
    <span class="tb-separator"></span>
    <button class="primary edit-btn" id="btnAddChild" onclick="addChildMember()">➕ 添加子成员</button>
    <button class="edit-btn" id="btnAddSibling" onclick="addSiblingMember()">👥 添加兄弟</button>
    <span class="tb-separator"></span>
    <button class="edit-btn" id="btnAddAttr" onclick="addAttribute()">📝 添加信息</button>
    <button class="edit-btn" id="btnDelAttr" onclick="deleteAttribute()">🗑️ 删除信息</button>
    <span class="tb-separator"></span>
    <button class="danger edit-btn" id="btnDelMember" onclick="deleteSelectedMember()">⚠️ 删除成员</button>
    <button class="edit-btn" id="btnSort" onclick="openSortDialog()" title="手动调整子女顺序">↕️ 子女排序</button>
    <span class="tb-separator"></span>
    <button onclick="expandAllNodes()">📂 全部展开</button>
    <button onclick="collapseAllNodes()">📁 全部折叠</button>
    <button id="btnExportChart" onclick="exportChartImage()" title="导出完整辈分关系图">📷 导出图片</button>
  </div>
  <div class="main-body" id="mainBody">
    <div class="tree-panel" id="treePanel"><div id="treeRoot"></div></div>
    <div class="sash" id="sash"></div>
    <div class="detail-panel" id="detailPanel">
      <div class="detail-header">
        <span class="key-icon">📄</span>
        <span id="detailTitle">请选择一个成员</span>
        <span class="key-path" id="detailPath"></span>
      </div>
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="properties" onclick="switchTab('properties')">📋 个人信息</button>
        <button class="tab-btn" data-tab="relation" onclick="switchTab('relation')">🔗 辈分关系图</button>
      </div>
      <div class="tab-content active" id="tab-properties">
        <div class="empty-state" id="emptyState"><span class="empty-icon">👈</span><span>在左侧选择成员</span></div>
        <table class="attr-table" id="attrTable" style="display:none;"><thead><tr><th>名称</th><th>数据</th></tr></thead><tbody id="attrTableBody"></tbody></table>
      </div>
      <div class="tab-content" id="tab-relation">
        <div class="view-mode-bar" id="viewModeBar">
          <div>
            <span>查看范围：</span>
            <button data-mode="full" class="active" onclick="setViewMode('full')">全图</button>
            <button data-mode="two" onclick="setViewMode('two')">上下各2代</button>
            <button data-mode="siblings" onclick="setViewMode('siblings')">同辈</button>
            <button data-mode="custom" onclick="setViewMode('custom')">自定义</button>
          </div>
          <div>
            <span>缩放：</span><button onclick="zoomIn()">➕</button><button onclick="zoomOut()">➖</button>
            <button onclick="zoomToFit()" id="btnFitScreen">适应屏幕</button>
            <button onclick="zoomReset()" id="btnOriginalSize">原始尺寸</button>
            <button onclick="exportChartImage()" title="导出完整辈分关系图" style="display:none;">📷 导出图片</button>
          </div>
        </div>
        <div class="org-chart" id="orgChartContainer">
          <div class="empty-state" id="relationEmpty"><span>请选择一个成员</span></div>
          <div class="org-tree" id="orgTree" style="display:none;"></div>
        </div>
        <div class="graph-legend">
          <span><span class="legend-dot" style="background:#e8f4fd;border:1px solid #0078d4;"></span> 当前成员</span>
          <span><span class="legend-dot" style="background:#f4fdf7;border:1px solid #27ae60;"></span> 其他成员</span>
          <span><span class="legend-dot" style="background:#fef5e7;border:1px solid #e67e22;"></span> 配偶</span>
        </div>
      </div>
    </div>
  </div>
  <div class="status-bar">
    <span>📍 代际：</span><span class="status-path" id="statusPath">族谱管理系统</span>
    <span class="status-count" id="statusCount">共 0 位成员</span>
  </div>
  <div class="copyright-bar">
    <span>版权所有©2026 林及第</span><span>|</span><span>联系方式：ld-1212@163.com</span>
  </div>
</div>
<div class="context-menu" id="contextMenu">
  <div class="cm-item" onclick="addChildMember()">➕ 添加子成员</div>
  <div class="cm-item" onclick="addSiblingMember()">👥 添加兄弟</div>
  <div class="cm-item" onclick="addAttribute()">📝 添加信息</div>
  <div class="cm-item danger" onclick="deleteSelectedMember()">🗑️ 删除</div>
</div>
<input type="file" id="fileInput" accept=".json" style="display:none;" onchange="handleFileImport(event)">

<script>
(function() {
  const STORAGE_KEY = 'jiumu_family_multi_v3';
  const CLOUD_API_URL = '/api/data';
  let appData = { families: [], currentFamilyId: null };
  let selectedNodeId = null;
  let expandedNodeIds = new Set();
  let currentTab = 'properties';
  let relationViewMode = 'full';
  let currentScale = 1;
  let customUp = 2, customDown = 2;
  let undoStack = [];
  let pendingDeleteAllData = null;
  let autoFitEnabled = false;

  let pendingOperations = [];
  let baseVersion = 0;
  let syncTimer = null;
  let isUserEditing = false;
  let currentUserRole = 'viewer';

  if (/Mobi|Android/i.test(navigator.userAgent)) document.body.classList.add('mobile-layout');

  function generateId() { return 'n' + Date.now() + Math.random().toString(36).substr(2, 8); }
  function getCurrentFamily() {
    if (!appData.currentFamilyId || appData.families.length === 0) return null;
    return appData.families.find(f => f.id === appData.currentFamilyId) || null;
  }
  function getCurrentRoot() { const fam = getCurrentFamily(); return fam ? fam.root : null; }
  function countMembers(node) { if (!node) return 0; let c = node.isRoot ? 0 : 1; if (node.children) for (const ch of node.children) c += countMembers(ch); return c; }
  function getAttr(node, name) { if (!node || !node.attributes) return ''; const a = node.attributes.find(a => a.name === name); return a ? a.value : ''; }
  function isMale(node) { return getAttr(node, '性别') !== '女'; }
  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function sortByBirthDateDesc(nodes) {
    return nodes.sort((a, b) => { const dA = getAttr(a, '出生日期') || '0000-00-00', dB = getAttr(b, '出生日期') || '0000-00-00'; return dA.localeCompare(dB); });
  }
  function isDateValid(dateStr) {
    if (!dateStr) return true;
    const parts = dateStr.split('-'); if (parts.length !== 3) return false;
    const y = parseInt(parts[0]), m = parseInt(parts[1]), d = parseInt(parts[2]);
    if (isNaN(y) || isNaN(m) || isNaN(d)) return false;
    if (m < 1 || m > 12 || d < 1 || d > 31) return false;
    const dt = new Date(y, m-1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== m-1 || dt.getDate() !== d) return false;
    return dt <= new Date();
  }
  function getNodePath(node) {
    const path = []; let cur = node; const root = getCurrentRoot();
    while (cur) { if (!cur.isRoot) path.unshift(cur.name); cur = findParentNode(root, cur.id); }
    return path;
  }
  function findNodeById(node, id) { if (node.id === id) return node; if (node.children) for (const c of node.children) { const f = findNodeById(c, id); if (f) return f; } return null; }
  function findParentNode(root, targetId) { if (!root.children) return null; for (const c of root.children) { if (c.id === targetId) return root; const f = findParentNode(c, targetId); if (f) return f; } return null; }
  function getMaxGeneration(node) {
    if (!node) return 0;
    if (!node.children || node.children.length === 0) return 0;
    let max = 0;
    for (const child of node.children) {
      const depth = getMaxGeneration(child);
      if (depth > max) max = depth;
    }
    return max + 1;
  }

  // ---------- 操作日志（加固版）----------
  function localApply(op) {
    const root = getCurrentRoot();
    if (!root) return false;
    const { action, payload } = op;
    switch (action) {
      case 'addChild': {
        const parent = findNodeById(root, payload.parentId);
        if (parent) { if (!parent.children) parent.children = []; parent.children.push(payload.node); return true; }
        return false;
      }
      case 'deleteMember': {
        const parent = findParentNode(root, payload.memberId);
        if (parent) { const idx = parent.children.findIndex(c => c.id === payload.memberId); if (idx !== -1) { parent.children.splice(idx, 1); return true; } }
        return false;
      }
      case 'setAttr': {
        const node = findNodeById(root, payload.memberId);
        if (node) { if (!node.attributes) node.attributes = []; const a = node.attributes.find(a => a.name === payload.attrName); if (a) a.value = payload.value; else node.attributes.push({ name: payload.attrName, value: payload.value }); return true; }
        return false;
      }
      case 'setName': {
        const node = findNodeById(root, payload.memberId);
        if (node) { node.name = payload.newName; return true; }
        return false;
      }
      case 'deleteAttr': {
        const node = findNodeById(root, payload.memberId);
        if (node && node.attributes) { node.attributes = node.attributes.filter(a => a.name !== payload.attrName); return true; }
        return false;
      }
      case 'addFamily': { appData.families.push(payload.family); return true; }
      case 'deleteFamily': { appData.families = appData.families.filter(f => f.id !== payload.familyId); return true; }
      case 'renameFamily': {
        const f = appData.families.find(f => f.id === payload.familyId);
        if (f) {
          f.name = payload.newName;
          if (f.root) f.root.name = payload.newName;
          return true;
        }
        return false;
      }
      case 'setFamilyPreface': { const f = appData.families.find(f => f.id === payload.familyId); if (f) { f.preface = payload.preface; return true; } return false; }
      case 'reorderChildren': {
        const parent = findNodeById(root, payload.parentId);
        if (parent && parent.children) {
          const reordered = []; for (const id of payload.newOrder) { const child = parent.children.find(c => c.id === id); if (child) reordered.push(child); }
          parent.children = reordered;
          return true;
        }
        return false;
      }
    }
    return false;
  }

  function saveDataToLocal() {
    appData._version = baseVersion;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  }

  function addOperation(action, payload) {
    const requiresRoot = ['addChild','deleteMember','setAttr','setName','deleteAttr','reorderChildren'];
    if (requiresRoot.includes(action) && !getCurrentRoot()) {
      alert('请先选择一个家族');
      return;
    }

    const op = { action, payload };
    const applied = localApply(op);
    if (!applied) {
      if (requiresRoot.includes(action)) {
        alert('操作失败，请刷新页面后重试');
      }
      return;
    }

    pendingOperations.push(op);
    renderTree();
    refreshDetailView();
    updateFamilySelector();
    updateStatusBar();
    saveDataToLocal();
    scheduleSync();
    localStorage.setItem('has_pending_changes', '1');
  }

  // ==================== 同步逻辑 ====================
  function scheduleSync() {
    if (syncTimer) clearTimeout(syncTimer);
    if (isUserEditing) {
      syncTimer = setTimeout(() => scheduleSync(), 2000);
      return;
    }
    syncTimer = setTimeout(() => syncNow(), 1500);
  }

  async function syncNow() {
    if (pendingOperations.length === 0) return;
    const ops = [...pendingOperations];
    let success = false;
    let retries = 3;
    while (retries-- > 0 && !success) {
      try {
        const res = await fetch(CLOUD_API_URL, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operations: ops })
        });
        if (res.ok) {
          const result = await res.json();
          baseVersion = result.version;
          pendingOperations = pendingOperations.filter(op => !ops.includes(op));
          if (pendingOperations.length === 0) {
            localStorage.removeItem('has_pending_changes');
          }
          saveDataToLocal();
          success = true;
        } else if (res.status === 409) {
          showInfoBar('⚠️ 数据冲突，正在更新为云端数据...', 0);
          try {
            const cloudRes = await fetch(CLOUD_API_URL);
            if (cloudRes.ok) {
              const cloudData = await cloudRes.json();
              const currentFamId = appData.currentFamilyId;
              loadRemoteData(cloudData, cloudData._version || 0);
              if (currentFamId && appData.families.some(f => f.id === currentFamId)) {
                appData.currentFamilyId = currentFamId;
              } else if (appData.families.length > 0) {
                appData.currentFamilyId = appData.families[0].id;
              }
              showInfoBar('✅ 已更新为云端数据', 2000);
            } else {
              showInfoBar('❌ 无法获取云端数据', 3000);
            }
          } catch {
            showInfoBar('❌ 网络错误', 3000);
          }
          pendingOperations = pendingOperations.filter(op => !ops.includes(op));
          localStorage.removeItem('has_pending_changes');
          success = true;
        } else {
          const err = await res.json();
          throw new Error(err.error || '同步失败');
        }
      } catch (e) {
        if (retries <= 0) {
          showInfoBar(`❌ 同步失败: ${e.message}`, 3000);
        } else {
          await new Promise(r => setTimeout(r, 500));
        }
      }
    }
  }

  // ==================== 数据加载 ====================
  function loadData() {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      try {
        appData = JSON.parse(s);
        baseVersion = appData._version || 0;
        if (!appData.families || !Array.isArray(appData.families)) throw new Error();
        appData.families.forEach(f => { if (f.preface === undefined) f.preface = ''; });
        if (appData.families.length === 0) {
          appData.currentFamilyId = null;
        } else if (!appData.currentFamilyId || !appData.families.find(f=>f.id===appData.currentFamilyId)) {
          appData.currentFamilyId = appData.families[0].id;
        }
      } catch (e) { appData = { families: [], currentFamilyId: null }; }
    } else {
      appData = { families: [], currentFamilyId: null };
    }
    saveDataToLocal();
    updateFamilySelector();
  }

  async function loadRemoteData(data, version) {
    const savedFamilyId = appData.currentFamilyId;
    appData = data;
    baseVersion = version;
    pendingOperations = [];
    selectedNodeId = null; expandedNodeIds.clear();
    if (savedFamilyId && appData.families.some(f => f.id === savedFamilyId)) {
      appData.currentFamilyId = savedFamilyId;
    } else if (appData.families.length > 0) {
      appData.currentFamilyId = appData.families[0].id;
    } else {
      appData.currentFamilyId = null;
    }
    const root = getCurrentRoot(); if (root) expandedNodeIds.add(root.id);
    saveDataToLocal();
    renderTree(); refreshDetailView(); updateFamilySelector();
  }

  async function initialSyncFromCloud() {
    try {
      const res = await fetch(CLOUD_API_URL);
      if (res.ok) {
        const cloudData = await res.json();
        if (cloudData.families && Array.isArray(cloudData.families)) {
          if (localStorage.getItem('has_pending_changes') === '1') {
            showInfoBar('📡 正在同步本地修改...', 0);
            await syncNow();
            if (localStorage.getItem('has_pending_changes') === '1') {
              showInfoBar('⚠️ 同步失败，保留本地数据，云端数据未加载', 4000);
              return;
            }
          }
          await loadRemoteData(cloudData, cloudData._version || 0);
        }
      }
    } catch (e) { /* 离线 */ }
  }

  function updateFamilySelector() {
    const sel = document.getElementById('familySelector'); if (!sel) return;
    sel.innerHTML = '';
    if (appData.families.length === 0) {
      const opt = document.createElement('option'); opt.value = ''; opt.textContent = '（无家族）'; sel.appendChild(opt);
      return;
    }
    appData.families.forEach(f => {
      const opt = document.createElement('option'); opt.value = f.id; opt.textContent = f.name;
      if (f.id === appData.currentFamilyId) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  window.switchFamily = function(familyId) {
    if (!familyId || familyId === appData.currentFamilyId) return;
    appData.currentFamilyId = familyId;
    selectedNodeId = null; expandedNodeIds.clear();
    const root = getCurrentRoot(); if (root) expandedNodeIds.add(root.id);
    saveDataToLocal();
    renderTree(); refreshDetailView(); updateFamilySelector();
  };

  // ---------- 渲染 ----------
  function renderTree() {
    const treeRoot = document.getElementById('treeRoot'); treeRoot.innerHTML = '';
    const root = getCurrentRoot(); if (!root) { treeRoot.innerHTML = '<div style="padding:20px; color:#888;">暂无家族数据</div>'; return; }
    function renderNode(node, depth, cont) {
      const div = document.createElement('div'); div.className = 'tree-node'; div.style.paddingLeft = (depth*20+4)+'px'; div.dataset.nodeId = node.id;
      if (node.id === selectedNodeId) div.classList.add('selected');
      const hasChildren = node.children && node.children.length > 0;
      const arrow = document.createElement('span'); arrow.className = 'tree-arrow'; arrow.textContent = '▶';
      if (!hasChildren) arrow.classList.add('no-children'); else if (expandedNodeIds.has(node.id)) arrow.classList.add('expanded');
      arrow.onclick = e => { e.stopPropagation(); if (hasChildren) toggleExpand(node.id); };
      div.appendChild(arrow);
      const icon = document.createElement('span'); icon.className = 'tree-icon'; icon.textContent = node.isRoot ? '🏠' : (hasChildren ? '📁' : '👤');
      div.appendChild(icon);
      div.appendChild(document.createTextNode(node.name));
      div.onclick = () => selectNode(node.id);
      div.oncontextmenu = e => { e.preventDefault(); showContextMenu(e.clientX, e.clientY, node); };
      cont.appendChild(div);
      if (hasChildren && expandedNodeIds.has(node.id)) {
        const cc = document.createElement('div'); cc.className = 'tree-children';
        sortByBirthDateDesc([...node.children]).forEach(c => renderNode(c, depth+1, cc));
        cont.appendChild(cc);
      }
      if (node.id === selectedNodeId) setTimeout(() => div.scrollIntoView({ behavior:'smooth', block:'center' }), 100);
    }
    renderNode(root, 0, treeRoot);
    if (!expandedNodeIds.has(root.id)) { expandedNodeIds.add(root.id); renderTree(); return; }
    updateStatusBar();
  }
  function toggleExpand(id) { expandedNodeIds.has(id) ? expandedNodeIds.delete(id) : expandedNodeIds.add(id); renderTree(); if (selectedNodeId) refreshDetailView(); }
  function selectNode(id) {
    selectedNodeId = id;
    refreshDetailView();
    renderTree();
    updateStatusBar();
    refreshEditButtons();
  }

  function refreshDetailView() {
    const root = getCurrentRoot();
    const n = selectedNodeId && root ? findNodeById(root, selectedNodeId) : null;
    if (currentTab === 'properties') renderDetailPanel(n); else renderOrgChart(n);
  }

  function renderDetailPanel(node) {
    const gen = (node && !node.isRoot) ? getNodePath(node).length : 0;
    document.getElementById('detailTitle').innerHTML = node
      ? `👤 ${escapeHtml(node.name)}${gen > 0 ? `<span style="font-size:10px; color:#444; margin-left:6px;">(第${gen}代)</span>` : ''}`
      : '请选择一个成员';
    
    const detailPathEl = document.getElementById('detailPath');
    if (node && !node.isRoot) {
      const ancestors = [];
      let cur = node;
      while (cur) {
        if (!cur.isRoot) ancestors.unshift({ id: cur.id, name: cur.name });
        cur = findParentNode(getCurrentRoot(), cur.id);
      }
      const pathHtml = ancestors.map(a =>
        `<a href="#" onclick="window.selectNode('${a.id}'); return false;" style="color:#0078d4; text-decoration:none; cursor:pointer;">${escapeHtml(a.name)}</a>`
      ).join(' <span style="color:#888;">></span> ');
      detailPathEl.innerHTML = '代际: ' + pathHtml;
    } else {
      detailPathEl.textContent = '';
    }

    const empty = document.getElementById('emptyState'), table = document.getElementById('attrTable'), tbody = document.getElementById('attrTableBody');
    if (!node || node.isRoot) { empty.style.display = 'flex'; table.style.display = 'none'; return; }
    empty.style.display = 'none'; table.style.display = 'table'; tbody.innerHTML = '';
    const sons = node.children ? node.children.filter(c => getAttr(c,'性别')==='男') : [];
    const daughters = node.children ? node.children.filter(c => getAttr(c,'性别')==='女') : [];
    const sonsHtml = sons.length ? sons.map(c => `<span class="child-link" data-child-id="${c.id}">${escapeHtml(c.name)}</span>`).join('、') : '（无）';
    const daughtersHtml = daughters.length ? daughters.map(c => `<span class="child-link" data-child-id="${c.id}">${escapeHtml(c.name)}</span>`).join('、') : '（无）';
    const fixedFields = [
      { name:'姓名', value:node.name, attr:null, type:'text' },
      { name:'性别', value:getAttr(node,'性别'), attr:'性别', type:'select' },
      { name:'出生日期', value:getAttr(node,'出生日期'), attr:'出生日期', type:'date' },
      { name:'出生地', value:getAttr(node,'出生地'), attr:'出生地', type:'text' },
      { name:'配偶', value:getAttr(node,'配偶'), attr:'配偶', type:'text' },
      { name:'子', value:sonsHtml, attr:null, editable:false, isHtml:true },
      { name:'女', value:daughtersHtml, attr:null, editable:false, isHtml:true }
    ];
    const customFields = [];
    if (node.attributes) node.attributes.forEach((attr, idx) => {
      if (fixedFields.some(f => f.attr===attr.name || f.name===attr.name)) return;
      if (attr.name==='职业'||attr.name==='简介'||attr.name==='备注') return;
      customFields.push({ name:attr.name, value:attr.value, idx });
    });
    const trailingFields = [
      { name:'职业', value:getAttr(node,'职业'), attr:'职业', type:'text' },
      { name:'简介', value:getAttr(node,'简介'), attr:'简介', type:'textarea' },
      { name:'备注', value:getAttr(node,'备注'), attr:'备注', type:'textarea' }
    ];
    const allRows = [...fixedFields, ...customFields.map(c => ({ name:c.name, value:c.value, attr:c.name, customIdx:c.idx, type:'text' })), ...trailingFields];
    allRows.forEach(f => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="col-name">${f.name}</td><td class="col-data" data-field="${f.name}">${f.isHtml ? f.value : `<span class="data-text">${escapeHtml(f.value||'（空）')}</span>`}</td>`;
      const tdData = tr.querySelector('.col-data');
      if (f.editable !== false) {
        tdData.addEventListener('dblclick', () => {
          if (!canEditNode(node)) return;
          if (f.isHtml) return;
          if (f.customIdx !== undefined) startEditingCustom(tr, f.customIdx, node);
          else startEditing(tr, f.name, node, f.attr, f.type);
        });
      }
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll('.child-link').forEach(link => {
      link.addEventListener('click', e => {
        e.stopPropagation();
        const childId = link.dataset.childId;
        if (childId) {
          const root = getCurrentRoot(), child = findNodeById(root, childId);
          if (child) {
            let p = child;
            while (p) { const par = findParentNode(root, p.id); if (par) expandedNodeIds.add(par.id); p = par; }
            expandedNodeIds.add(childId); selectNode(childId); switchTab('properties');
          }
        }
      });
    });
  }

  function startEditing(tr, fieldName, node, attrName, fieldType) {
    isUserEditing = true;
    const td = tr.querySelector('.col-data'); if (td.querySelector('input,textarea,select')) return;
    const currentVal = fieldName === '姓名' ? node.name : (attrName ? getAttr(node, attrName) : '');
    let input;
    if (fieldType === 'select') { input = document.createElement('select'); input.innerHTML = '<option value="男">男</option><option value="女">女</option>'; input.value = (currentVal==='男'||currentVal==='女')?currentVal:'男'; }
    else if (fieldType === 'date') { input = document.createElement('input'); input.type = 'date'; input.value = currentVal; }
    else if (fieldType === 'textarea') { input = document.createElement('textarea'); input.value = currentVal; input.style.minHeight = '60px'; }
    else { input = document.createElement('input'); input.type = 'text'; input.value = currentVal; }
    td.innerHTML = ''; td.appendChild(input); input.focus();
    const save = () => {
      let newVal = input.value.trim();
      if (fieldType === 'select' && newVal !== '男' && newVal !== '女') { alert('性别只能为"男"或"女"'); input.focus(); return; }
      if (fieldType === 'date' && newVal && !isDateValid(newVal)) { alert('出生日期不能晚于今天'); input.focus(); return; }
      if (fieldName === '姓名' && newVal && newVal !== node.name) {
        addOperation('setName', { memberId: node.id, newName: newVal });
      } else if (attrName) {
        addOperation('setAttr', { memberId: node.id, attrName, value: newVal });
      }
      isUserEditing = false;
      scheduleSync();
    };
    input.addEventListener('blur', () => {
      isUserEditing = false;
      scheduleSync();
      save();
    });
    input.addEventListener('keydown', e => { if (e.key==='Enter' && fieldType!=='textarea') { e.preventDefault(); save(); } });
  }

  function startEditingCustom(tr, idx, node) {
    isUserEditing = true;
    const td = tr.querySelector('.col-data'); if (td.querySelector('input')) return;
    const currentVal = node.attributes[idx]?.value || '';
    const input = document.createElement('input'); input.value = currentVal; td.innerHTML = ''; td.appendChild(input); input.focus();
    const save = () => {
      if (node.attributes[idx]) {
        addOperation('setAttr', { memberId: node.id, attrName: node.attributes[idx].name, value: input.value.trim() });
      }
      isUserEditing = false;
      scheduleSync();
    };
    input.addEventListener('blur', () => {
      isUserEditing = false;
      scheduleSync();
      save();
    });
    input.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); save(); } });
  }

  // ---------- 编辑操作（权限校验）----------
  function ensureEditPermission(node) {
    if (!node) { alert('请先选择一个成员'); return false; }
    if (!canEditNode(node)) { alert('您没有编辑该成员的权限'); return false; }
    return true;
  }

  function addAttribute() {
    if (!selectedNodeId || !getCurrentRoot()) { alert('请先选择一个成员'); return; }
    const node = findNodeById(getCurrentRoot(), selectedNodeId);
    if (!ensureEditPermission(node)) return;
    const name = prompt('新信息名称：'); if (!name?.trim()) return;
    const trimmed = name.trim();
    if (trimmed === '职业' || trimmed === '简介' || trimmed === '备注') { alert('该信息已存在固定位置'); return; }
    if (node.attributes && node.attributes.some(a => a.name === trimmed)) { alert('该信息已存在'); return; }
    addOperation('setAttr', { memberId: node.id, attrName: trimmed, value: '' });
  }

  function deleteAttribute() {
    if (!selectedNodeId || !getCurrentRoot()) return;
    const node = findNodeById(getCurrentRoot(), selectedNodeId);
    if (!ensureEditPermission(node)) return;
    const name = prompt('要删除的信息名称：');
    if (name) addOperation('deleteAttr', { memberId: node.id, attrName: name });
  }

  function deleteSelectedMember(id) {
    const nid = id || selectedNodeId; if (!nid) return;
    const root = getCurrentRoot(); if (!root) return;
    const node = findNodeById(root, nid);
    if (!ensureEditPermission(node)) return;
    if (node.isRoot) return;
    if (confirm(`确定删除「${node.name}」及其后代吗？`)) {
      const parent = findParentNode(root, nid);
      if (parent) {
        const idx = parent.children.findIndex(c => c.id === nid);
        if (idx !== -1) {
          const deletedNode = parent.children.splice(idx, 1)[0];
          const snapshot = JSON.parse(JSON.stringify(deletedNode));
          undoStack.push({ node: snapshot, parentId: parent.id });
          if (undoStack.length > 20) undoStack.shift();
          addOperation('deleteMember', { memberId: nid });
          if (selectedNodeId === nid) selectedNodeId = parent.id;
          showUndoBar(deletedNode.name, undoStack.length);
        }
      }
    }
  }

  function addChildMember(id) {
    const nid = id || selectedNodeId; if (!nid) return;
    const root = getCurrentRoot(); if (!root) return;
    const n = findNodeById(root, nid);
    if (!ensureEditPermission(n)) return;
    showMemberDialog(null, n);
  }

  function addSiblingMember(id) {
    const nid = id || selectedNodeId; if (!nid) return;
    const root = getCurrentRoot(); if (!root) return;
    const n = findNodeById(root, nid);
    if (!ensureEditPermission(n)) return;
    if (n.isRoot) return;
    if (currentUserRole === 'editor' && isFatherOfCurrentUser(n)) {
      alert('您只能为本人或直系后代添加兄弟');
      return;
    }
    const p = findParentNode(root, nid);
    if (!p) return;
    showMemberDialog(null, p);
  }

  function showUndoBar(name, count) {

  function performUndo(bar) {
    if (undoStack.length === 0) return;
    const { node: restoredNode, parentId } = undoStack.pop();
    bar.remove();
    addOperation('addChild', { parentId, node: restoredNode });
    showInfoBar('已撤销删除');
    if (undoStack.length > 0) {
      const last = undoStack[undoStack.length - 1];
      showUndoBar(last.node.name, undoStack.length);
    }
  }

  function handleFileImport(e) {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.families && Array.isArray(data.families)) {
          data._forceOverwrite = true;
          fetch(CLOUD_API_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
            .then(res => {
              if (!res.ok) return res.json().then(err => { throw new Error(err.error || '导入失败'); });
              return res.json();
            })
            .then(result => {
              if (result.version) { baseVersion = result.version; appData = data; appData._version = result.version; pendingOperations = []; }
              selectedNodeId = null; expandedNodeIds.clear();
              const root = getCurrentRoot(); if (root) expandedNodeIds.add(root.id);
              saveDataToLocal(); renderTree(); refreshDetailView(); updateFamilySelector(); switchTab('properties');
            })
            .catch(err => alert('导入失败: ' + err.message));
        } else if (data.isRoot) {
          const fam = { id: generateId(), name: '导入的家族', root: data, preface: '' };
          addOperation('addFamily', { family: fam });
          appData.currentFamilyId = fam.id;
          selectedNodeId = null; expandedNodeIds.clear(); expandedNodeIds.add(fam.root.id);
          renderTree(); refreshDetailView(); updateFamilySelector();
        } else throw new Error();
      } catch (ex) { alert('文件格式错误'); }
    };
    reader.readAsText(f);
  }

  function renderOrgChart(node){
    const gen = (node && !node.isRoot) ? getNodePath(node).length : 0;
    document.getElementById('detailTitle').innerHTML = node
      ? `🏢 ${escapeHtml(node.name)}${gen > 0 ? `<span style="font-size:10px; color:#444; margin-left:6px;">(第${gen}代)</span>` : ''}`
      : '请选择一个成员';

    const detailPathEl = document.getElementById('detailPath');
    if (node && !node.isRoot) {
      const ancestors = [];
      let cur = node;
      while (cur) {
        if (!cur.isRoot) ancestors.unshift({ id: cur.id, name: cur.name });
        cur = findParentNode(getCurrentRoot(), cur.id);
      }
      const pathHtml = ancestors.map(a =>
        `<a href="#" onclick="window.selectNode('${a.id}'); return false;" style="color:#0078d4; text-decoration:none; cursor:pointer;">${escapeHtml(a.name)}</a>`
      ).join(' <span style="color:#888;">></span> ');
      detailPathEl.innerHTML = '代际: ' + pathHtml;
    } else {
      detailPathEl.textContent = '';
    }

    const orgTree=document.getElementById('orgTree'), empty=document.getElementById('relationEmpty');
    orgTree.innerHTML=''; orgTree.style.display='none'; empty.style.display='flex';
    if(!node || node.isRoot) return;
    const root=getCurrentRoot(); let maleNode=node;
    if(!isMale(maleNode)){ const p=findParentNode(root, maleNode.id); if(p && !p.isRoot && isMale(p)) maleNode=p; else return; }
    let treeData=null;
    if(relationViewMode==='siblings'){ const parent=findParentNode(root,maleNode.id); const siblings=parent&&!parent.isRoot?parent.children.filter(c=>isMale(c)):[maleNode]; const sorted=sortByBirthDateDesc([...siblings]); treeData={ node:sorted.find(s=>s.id===maleNode.id)||maleNode, siblings:sorted.filter(s=>s.id!==maleNode.id) }; }
    else if(relationViewMode==='two'||relationViewMode==='custom'){
      const up=relationViewMode==='two'?2:customUp, down=relationViewMode==='two'?2:customDown;
      let ancestors=[], cur=maleNode;
      if(up>0) for(let i=0;i<up;i++){ const p=findParentNode(root,cur.id); if(!p||p.isRoot) break; if(isMale(p)){ ancestors.unshift(p); cur=p; }else break; }
      function buildDesc(n,depth){ const f={node:n,children:[]}; if(down===0 && depth===0) return f; if(depth<down && n.children) sortByBirthDateDesc(n.children.filter(c=>isMale(c))).forEach(c=>f.children.push(buildDesc(c,depth+1))); return f; }
      if(down===0){ const rootDesc={node:maleNode,children:[]}; if(ancestors.length>0){ let rn=ancestors[0], prev=null; ancestors.forEach(anc=>{ const obj={node:anc,children:[]}; if(prev) prev.children.push(obj); else rn=obj; prev=obj; }); prev.children.push(rootDesc); treeData=rn; }else treeData=rootDesc; }
      else{ const rootDesc=buildDesc(maleNode,0); if(ancestors.length>0){ let rn=ancestors[0], prev=null; ancestors.forEach(anc=>{ const obj={node:anc,children:[]}; if(prev) prev.children.push(obj); else rn=obj; prev=obj; }); prev.children.push(rootDesc); treeData=rn; }else treeData=rootDesc; }
    } else {
      function buildFull(n){ const f={node:n,children:[]}; if(n.children) sortByBirthDateDesc(n.children.filter(c=>isMale(c))).forEach(c=>f.children.push(buildFull(c))); return f; }
      let anc=maleNode; while(true){ const p=findParentNode(root,anc.id); if(p&&!p.isRoot&&isMale(p)) anc=p; else break; }
      treeData=buildFull(anc);
    }
    if(!treeData) return;
    empty.style.display='none'; orgTree.style.display='inline-flex'; orgTree.style.transform=`scale(${currentScale})`;
    function createCard(n,self,spouse=false){ 
      const card=document.createElement('div'); 
      card.className='org-node'+(spouse?' node-spouse':(self?' node-self':' node-other')); 
      card.innerHTML=`<span class="node-name">${escapeHtml(n.name)}</span><span class="node-years">${getAttr(n,'出生日期')||''}</span>`; 
      card.onclick=()=>{ selectNode(n.id); switchTab('relation'); }; 
      return card; 
    }
    function renderNode(tn,container,isSelf){
      if(tn.siblings){ const all=[tn.node,...tn.siblings]; const row=document.createElement('div'); row.className='sibling-row'; all.forEach(s=>{ const sp=getAttr(s,'配偶'); if(sp){ const pair=document.createElement('div'); pair.className='spouse-pair'; pair.appendChild(createCard(s,s.id===maleNode.id)); const sc=document.createElement('div'); sc.className='org-node node-spouse'; sc.innerHTML=`<span class="node-name">${escapeHtml(sp)}</span>`; sc.onclick=()=>{ selectNode(s.id); switchTab('relation'); }; pair.appendChild(sc); row.appendChild(pair); } else row.appendChild(createCard(s,s.id===maleNode.id)); }); container.appendChild(row); return; }
      const branch=document.createElement('div'); branch.className='org-branch';
      const sp=getAttr(tn.node,'配偶');
      if(sp){ const pair=document.createElement('div'); pair.className='spouse-pair'; pair.appendChild(createCard(tn.node,isSelf)); const sc=document.createElement('div'); sc.className='org-node node-spouse'; sc.innerHTML=`<span class="node-name">${escapeHtml(sp)}</span>`; sc.onclick=()=>{ selectNode(tn.node.id); switchTab('relation'); }; pair.appendChild(sc); branch.appendChild(pair); if(tn.children&&tn.children.length) pair.classList.add('has-children'); }
      else { const card=createCard(tn.node,isSelf); if(tn.children&&tn.children.length) card.classList.add('has-children'); branch.appendChild(card); }
      if(tn.children&&tn.children.length){ const chDiv=document.createElement('div'); chDiv.className='org-children'+(tn.children.length>1?' multiple':''); tn.children.forEach(ch=>renderNode(ch,chDiv,ch.node.id===maleNode.id)); branch.appendChild(chDiv); }
      container.appendChild(branch);
    }
    renderNode(treeData, orgTree, treeData.node.id===maleNode.id);
  }

  function switchTab(tab){ currentTab=tab; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active')); document.querySelector(`[data-tab="${tab}"]`).classList.add('active'); document.getElementById('tab-'+tab).classList.add('active'); if(tab==='relation') updateViewModeButtons(relationViewMode); refreshDetailView(); }
  function applyScale(){ document.getElementById('orgTree').style.transform=`scale(${currentScale})`; }
  function zoomIn(){ autoFitEnabled=false; currentScale=Math.min(3,currentScale+0.2); applyScale(); updateZoomButtons(); }
  function zoomOut(){ autoFitEnabled=false; currentScale=Math.max(0.2,currentScale-0.2); applyScale(); updateZoomButtons(); }
  function zoomReset(){ autoFitEnabled=false; currentScale=1; applyScale(); updateZoomButtons(); }
  function zoomToFit(){ const t=document.getElementById('orgTree'),c=document.getElementById('orgChartContainer'); if(!t||!c) return; currentScale=Math.min(1,(c.clientWidth-40)/t.scrollWidth); autoFitEnabled=true; applyScale(); updateZoomButtons(); }

  function setupPinchZoom() {
    const container = document.getElementById('orgChartContainer');
    if (!container) return;
    let initialDistance = 0;
    let initialScale = 1;

    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = currentScale;
      }
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const newDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (initialDistance > 0) {
          const newScale = initialScale * (newDistance / initialDistance);
          currentScale = Math.min(3, Math.max(0.2, newScale));
          applyScale();
          updateZoomButtons();
          autoFitEnabled = false;
        }
      }
    }, { passive: false });

    container.addEventListener('touchend', () => {
      initialDistance = 0;
    });
  }

  function exportChartImage(){
    const orgTree=document.getElementById('orgTree'), container=document.getElementById('orgChartContainer');
    if(!orgTree||!container) return;
    const prevT=orgTree.style.transform, prevO=container.style.overflow, prevW=container.style.width, prevH=container.style.height;
    const fw=orgTree.scrollWidth+60, fh=orgTree.scrollHeight+60;
    orgTree.style.transform='scale(1)'; container.style.overflow='visible'; container.style.width=fw+'px'; container.style.height=fh+'px';
    const nodes=[...container.querySelectorAll('.org-node')]; const shadows=nodes.map(n=>({n,bs:n.style.boxShadow})); nodes.forEach(n=>n.style.boxShadow='none');
    html2canvas(container,{backgroundColor:'#ffffff',scale:2,allowTaint:false,useCORS:true,logging:false,width:fw,height:fh,windowWidth:fw,windowHeight:fh,
      onclone:clonedDoc=>{
        const cc=clonedDoc.getElementById('orgChartContainer'); if(cc){cc.style.overflow='visible';cc.style.width=fw+'px';cc.style.height=fh+'px';cc.style.background='#ffffff';}
        const ct=clonedDoc.getElementById('orgTree'); if(ct){ct.style.transform='scale(1)';ct.style.background='#ffffff';}

      shadows.forEach(s=>s.n.style.boxShadow=s.bs);
      const a=document.createElement('a'); a.download='辈分关系图.png'; a.href=canvas.toDataURL('image/png'); a.click();
    }).catch(err=>{ orgTree.style.transform=prevT; container.style.overflow=prevO; container.style.width=prevW; container.style.height=prevH; shadows.forEach(s=>s.n.style.boxShadow=s.bs); alert('导出失败:'+err); });

  // 搜索（排除“简介”）
  function openSearchDialog(){
    const overlay=document.createElement('div'); overlay.className='modal-overlay';
    overlay.innerHTML=`<div class="modal-dialog" style="width:450px;"><div class="modal-header">🔍 搜索</div><div class="modal-body"><div class="form-group"><label>关键字（空格分隔）</label><input type="text" id="searchInput" style="width:100%;padding:8px;"></div></div><div class="modal-footer"><button class="btn-cancel" id="searchCancel">取消</button><button class="btn-primary" id="searchOk">搜索</button></div></div>`;
    document.body.appendChild(overlay);
    document.getElementById('searchCancel').onclick=()=>overlay.remove();
    document.getElementById('searchOk').onclick=()=>{ const kw=document.getElementById('searchInput').value.trim(); overlay.remove(); if(kw) searchMember(kw); };
  }
  function searchMember(kw){
    const keys=kw.split(/\s+/).filter(k=>k.length>0); if(!keys.length) return;
    const res=[]; const root=getCurrentRoot(); if(!root) return;
    function match(n){ 
      if(n.isRoot) return false; 
      const attrsValues = (n.attributes || []).filter(a => a.name !== '简介').map(a => a.value || '');
      const txt=[n.name,...attrsValues].join(' ').toLowerCase(); 
      return keys.every(k=>txt.includes(k.toLowerCase())); 
    }
    function walk(n,path){ if(match(n)) res.push({node:n,path}); if(n.children) n.children.forEach(c=>walk(c,[...path,n.name])); }
    walk(root,[]);
    if(!res.length){ alert('未找到'); return; }
    if(res.length===1){ const t=res[0].node; let p=t; while(p){ const par=findParentNode(root,p.id); if(par) expandedNodeIds.add(par.id); p=par; } expandedNodeIds.add(t.id); selectNode(t.id); switchTab('properties'); return; }
    const overlay=document.createElement('div'); overlay.className='modal-overlay';
    overlay.innerHTML=`<div class="modal-dialog"><div class="modal-header">找到 ${res.length} 位</div><div class="modal-body">${res.map(r=>`<div style="padding:8px;cursor:pointer;border-bottom:1px solid #eee;" data-id="${r.node.id}">${escapeHtml(r.node.name)} <span style="color:#888;font-size:11px;">${r.path.join(' > ')}</span></div>`).join('')}</div><div class="modal-footer"><button class="btn-cancel">关闭</button></div></div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('.btn-cancel').onclick=()=>overlay.remove();
    overlay.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>{ const id=el.dataset.id; overlay.remove(); const node=findNodeById(root,id); if(node){ let p=node; while(p){ const par=findParentNode(root,p.id); if(par) expandedNodeIds.add(par.id); p=par; } expandedNodeIds.add(node.id); selectNode(node.id); switchTab('properties'); } }));
  }

    const overlay=document.createElement('div'); overlay.className='modal-overlay';
    overlay.innerHTML=`<div class="modal-dialog" style="width:360px;"><div class="modal-header">修改密码</div><div class="modal-body">
      <div class="form-group"><label>旧密码</label><input type="password" id="oldPass" style="width:100%;padding:8px;"></div>
      <div class="form-group"><label>新密码</label><input type="password" id="newPass" style="width:100%;padding:8px;"></div>

    </div><div class="modal-footer"><button class="btn-cancel" id="cancelChange">取消</button><button class="btn-primary" id="submitChange">确认修改</button></div></div>`;

      if(p1.length<4){ alert('新密码至少4位'); return; }
      try{
        const res=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({oldPassword:old,newPassword:p1})});
        const data=await res.json();
        if(res.ok){
          pendingOperations = [];

          overlay.remove();
          logout();
        } else alert(data.error||'修改失败');
      }catch{ alert('网络错误'); }
    };
    overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.remove(); });
  }

  function logout(){
    pendingOperations = [];
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem('has_pending_changes');

    fetch('/api/auth/logout',{method:'POST'}).then(()=>window.location.href='/login.html').catch(()=>window.location.href='/login.html');

    const payload = JSON.parse(JSON.stringify(appData));

    fetch(CLOUD_API_URL, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), keepalive:true }).catch(()=>{});

  // ---------- 备份管理 ----------
  async function openBackupDialog() {
    try {
      const res = await fetch('/api/data?action=list_backups');
      if (!res.ok) { alert('获取备份列表失败'); return; }
      const data = await res.json();
      const backups = data.backups || [];

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      let listHtml = backups.length === 0
        ? '<div style="padding:20px;text-align:center;color:#888;">暂无备份</div>'
        : backups.map(b => `<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee;">
            <span>${new Date(b.timestamp).toLocaleString()}</span>
            <button data-key="${b.key}" class="restoreBtn btn-primary" style="padding:4px 12px;">恢复此版本</button>
          </div>`).join('');

      overlay.innerHTML = `<div class="modal-dialog"><div class="modal-header">备份管理（自动每5分钟备份）</div><div class="modal-body">${listHtml}</div><div class="modal-footer"><button class="btn-cancel" id="closeBackup">关闭</button></div></div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#closeBackup').onclick = () => overlay.remove();
      overlay.querySelectorAll('.restoreBtn').forEach(btn => {
        btn.onclick = async () => {
          if (!confirm('确定要恢复到该备份吗？当前数据将被覆盖。')) return;
          const backupKey = btn.dataset.key;
          const res = await fetch('/api/data?action=restore', {
            method: 'POST',

          });

            alert('恢复成功！页面将刷新。');
            location.reload();
          } else {
            const err = await res.json();
            alert('恢复失败：' + (err.error || '未知错误'));
          }
        };
      });
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

      alert('请求失败：' + e.message);

  }

  function updateStatusBar(){
    const root=getCurrentRoot(), fam=getCurrentFamily();
    if(selectedNodeId && root){
      const node = findNodeById(root, selectedNodeId);
      if(node && !node.isRoot){
        const ancestors = [];
        let cur = node;
        while(cur){
          if(!cur.isRoot) ancestors.unshift({id: cur.id, name: cur.name});
          cur = findParentNode(root, cur.id);
        }
        const pathHtml = ancestors.map(a =>
          `<a href="#" onclick="window.selectNode('${a.id}'); return false;" style="color:#0078d4; text-decoration:none; cursor:pointer;">${escapeHtml(a.name)}</a>`
        ).join(' <span style="color:#888;">></span> ');
        document.getElementById('statusPath').innerHTML = pathHtml;
      } else {
        document.getElementById('statusPath').textContent = fam ? fam.name : '族谱管理系统';
      }
    } else {
      document.getElementById('statusPath').textContent = fam ? fam.name : '族谱管理系统';
    }
    const memberCount = root ? countMembers(root) : 0;
    const genCount = root ? getMaxGeneration(root) : 0;
    document.getElementById('statusCount').textContent = `共 ${memberCount} 位成员，${genCount} 代`;
  }

  // ==================== 分割线拖拽 ====================
  function setupSash() {
    if (document.body.classList.contains('mobile-layout')) return;

    const sash = document.getElementById('sash');
    const mainBody = document.getElementById('mainBody');
    const treePanel = document.getElementById('treePanel');

    let startX = 0;
    let startWidth = 0;
    let dragging = false;

    function onMouseMove(e) {
      if (!dragging) return;
      e.preventDefault();
      const dx = e.clientX - startX;
      let newWidth = startWidth + dx;
      newWidth = Math.max(180, newWidth);
      treePanel.style.width = newWidth + 'px';
      sash.classList.add('active');
    }

    function onMouseUp() {
      if (!dragging) return;
      dragging = false;
      sash.classList.remove('active');
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
      document.body.style.cursor = '';
    }

    sash.addEventListener('mousedown', function(e) {
      e.preventDefault();
      dragging = true;
      startX = e.clientX;
      startWidth = treePanel.getBoundingClientRect().width;
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
      document.body.style.cursor = 'col-resize';
    });
  }

  // ==================== 角色权限控制 ====================
  function applyRolePermissions() {
    const isAdmin = (currentUserRole === 'admin');
    const menuFile = document.getElementById('menuFile');
    if (menuFile) menuFile.style.display = isAdmin ? '' : 'none';
    const menuBackup = document.getElementById('menuBackup');
    if (menuBackup) menuBackup.style.display = isAdmin ? '' : 'none';
    const menuAdmin = document.getElementById('menuAdmin');
    if (menuAdmin) menuAdmin.style.display = isAdmin ? '' : 'none';
    const btnExportChart = document.getElementById('btnExportChart');
    if (btnExportChart) btnExportChart.style.display = isAdmin ? '' : 'none';
    refreshEditButtons();
  }

  function isFatherOfCurrentUser(node) {
    if (currentUserRole !== 'editor') return false;
    const username = document.getElementById('usernameDisplay').textContent.split(' ')[0];
    if (!node || !node.children) return false;
    return node.children.some(child => child.name === username);
  }

  function canEditNode(node) {
    if (!node) return false;
    if (currentUserRole === 'admin' && node.isRoot) return true;
    if (node.isRoot) return false;
    if (currentUserRole === 'admin') return true;
    if (currentUserRole === 'viewer') return false;
    if (currentUserRole === 'editor') {
      const username = document.getElementById('usernameDisplay').textContent.split(' ')[0];
      if (node.name === username) return true;
      if (isFatherOfCurrentUser(node)) return true;
      const root = getCurrentRoot();
      let cur = node;
      while (cur) {
        const p = findParentNode(root, cur.id);
        if (!p || p.isRoot) break;
        if (p.name === username) return true;
        cur = p;
      }
      return false;
    }
    return false;
  }

  function canAddSibling(node) {
    if (!node || node.isRoot) return false;
    if (currentUserRole === 'admin') return true;
    if (currentUserRole === 'viewer') return false;
    if (isFatherOfCurrentUser(node)) return false;
    return canEditNode(node);
  }

  function refreshEditButtons() {
    const isAdmin = (currentUserRole === 'admin');
    const isEditor = (currentUserRole === 'editor');
    const node = selectedNodeId ? findNodeById(getCurrentRoot(), selectedNodeId) : null;
    const canEdit = node ? canEditNode(node) : false;
    const canSibling = node ? canAddSibling(node) : false;

    const editButtons = document.querySelectorAll('.edit-btn');
    if (isAdmin) {
      editButtons.forEach(b => b.disabled = false);
    } else if (isEditor) {
      editButtons.forEach(b => {
        if (b.id === 'btnAddSibling') {
          b.disabled = !canSibling;
        } else {
          b.disabled = !canEdit;
        }
      });
    } else {
      editButtons.forEach(b => b.disabled = true);
    }
  }

  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
    if(e.key==='Delete'){ e.preventDefault(); if(selectedNodeId) deleteSelectedMember(); }
    else if(e.ctrlKey && e.key==='z'){
      e.preventDefault();
      const undoBtn=document.getElementById('undoDeleteBtn');
      if(undoBtn) undoBtn.click();
      else{ const undoAll=document.getElementById('undoDeleteAllBtn'); if(undoAll) undoAll.click(); }
    }
  });

  document.addEventListener('focusin', (e) => {
    if (e.target.matches('input, textarea, select')) {
      isUserEditing = true;
    }
  });
  document.addEventListener('focusout', () => {
    setTimeout(() => {
      if (!document.activeElement || !document.activeElement.matches('input, textarea, select')) {
        isUserEditing = false;
        scheduleSync();
      }
    }, 200);
  });

  async function loadFromCloud() {
    if (!confirm('从云端加载将覆盖当前所有数据，确定继续吗？')) return;
    showInfoBar('正在从云端加载...', 0);
    try {
      const res = await fetch(CLOUD_API_URL);
      if (!res.ok) { const err = await res.json(); showInfoBar(`❌ 加载失败: ${err.error}`, 3000); return; }
      const cloudData = await res.json();
      if (cloudData.families && Array.isArray(cloudData.families)) {
        await loadRemoteData(cloudData, cloudData._version || 0);
        showInfoBar('✅ 云端数据加载成功', 3000);
      } else { showInfoBar('❌ 云端数据格式错误', 3000); }
    } catch (e) { showInfoBar(`❌ 网络错误: ${e.message}`, 3000); }
  }

  async function init(){
    await loadUserInfo();
    applyRolePermissions();

    loadData();
    initialSyncFromCloud().then(() => {
      const root = getCurrentRoot();
      if (root) expandedNodeIds.add(root.id);
      renderTree();
      updateStatusBar();
      updateFamilySelector();
    });

    setupPinchZoom();
    setupSash();
    window.addEventListener('beforeunload', uploadOnClose);
    document.querySelectorAll('.menu-item[data-menu]').forEach(item=>{
      const dd=item.querySelector('.dropdown-menu');
      if(dd){
        item.addEventListener('click',function(e){ e.stopPropagation(); const wasOpen=dd.classList.contains('show'); document.querySelectorAll('.dropdown-menu.show').forEach(m=>m.classList.remove('show')); if(!wasOpen) dd.classList.add('show'); });
        dd.addEventListener('click',function(e){ e.stopPropagation(); dd.classList.remove('show'); });
      }
    });
    document.addEventListener('click',()=>document.querySelectorAll('.dropdown-menu.show').forEach(m=>m.classList.remove('show')));
    updateViewModeButtons('full'); updateZoomButtons();
    window.setViewMode=setViewMode; window.zoomIn=zoomIn; window.zoomOut=zoomOut; window.zoomToFit=zoomToFit; window.zoomReset=zoomReset;
    window.exportChartImage=exportChartImage; window.openSortDialog=openSortDialog; window.openSearchDialog=openSearchDialog;
    window.openFamilyManageDialog=openFamilyManageDialog; window.openPrefaceDialog=openPrefaceDialog;
    window.changePassword=changePassword; window.logout=logout;
    window.deleteAllData=deleteAllData;
    window.syncNow = syncNow;
    window.openBackupDialog = openBackupDialog;
    window.openAdminDialog = openAdminDialog;
  }
  init();
  window.addChildMember=addChildMember; window.addSiblingMember=addSiblingMember;
  window.deleteSelectedMember=deleteSelectedMember; window.addAttribute=addAttribute; window.deleteAttribute=deleteAttribute;
  window.expandAllNodes=expandAllNodes; window.collapseAllNodes=collapseAllNodes;
  window.exportData=exportData; window.importData=importData; window.deleteAllData=deleteAllData;
  window.showHelp=showHelp; window.handleFileImport=handleFileImport; window.switchTab=switchTab;
  window.switchFamily=switchFamily;
  window.syncToCloud=syncNow; window.loadFromCloud=loadFromCloud;
  window.selectNode = selectNode;
  window.openBackupDialog = openBackupDialog;
  window.openAdminDialog = openAdminDialog;
})();
</script>
