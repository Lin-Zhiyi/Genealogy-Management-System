<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>族谱管理系统</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
  </script>
  <style>
    :root {
      --bg-menu: #f2f2f2;
      --bg-status: #f0f0f0;
      --bg-main: #ffffff;
      --bg-tree: #ffffff;
      --border-color: #c8c8c8;
      --highlight-bg: #0078d4;
      --highlight-text: #ffffff;
      --hover-bg: #e8f0fe;
      --danger-bg: #c42b1c;
      --font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      --font-mono: 'Cascadia Code', 'Consolas', monospace;
      --color-self: #0078d4;
      --color-other: #27ae60;
      --color-spouse: #e67e22;
      --org-line-color: #b0b8c8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      font-size: 13px;
      background: #e8e8e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      padding: 10px;
      overflow-y: auto;
      overflow-x: auto;
    }

    .app-window {
      width: 100%;
      max-width: none;
      min-height: 92vh;
      background: var(--bg-main);
      border: 1px solid #999;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      position: relative;
    }

    .title-bar {
      background: linear-gradient(180deg, #fafafa 0%, #e8e8e8 100%);
      border-bottom: 1px solid #c0c0c0;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: #333;
      flex-shrink: 0;
    }

    .app-icon {
      width: 20px;
      height: 20px;
      background: #0078d4;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
    }

    .app-title {
      flex: 1;
    }

    .app-version {
      font-size: 11px;
      font-weight: 400;
      color: #888;
      margin-left: 8px;
    }

    .menu-bar {
      background: var(--bg-menu);
      border-bottom: 1px solid #d0d0d0;
      padding: 3px 6px;
      display: flex;
      gap: 2px;
      flex-shrink: 0;
      flex-wrap: wrap;
      align-items: center;
    }

    .menu-item {
      padding: 5px 13px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12.5px;
      color: #333;
      position: relative;
    }

    .menu-item:hover {
      background: #dce4f0;
    }

    .separator {
      width: 1px;
      background: #c8c8c8;
      margin: 3px 6px;
      align-self: stretch;
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      background: #fafafa;
      border: 1px solid #b0b0b0;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      z-index: 1000;
      min-width: 200px;
      padding: 4px 0;
      display: none;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dm-item {
      padding: 7px 20px;
      cursor: pointer;
      font-size: 12.5px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dm-item:hover {
      background: #e0e8f4;
    }

    .dm-item.danger {
      color: #c42b1c;
    }

    .toolbar {
      background: #f7f7f7;
      border-bottom: 1px solid #d8d8d8;
      padding: 5px 10px;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar button {
      padding: 6px 14px;
      border: 1px solid #c0c0c0;
      border-radius: 5px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 12px;
    }

    .toolbar button:hover {
      background: #e8ecf2;
    }

    .toolbar button.primary {
      background: #0078d4;
      color: #fff;
      border-color: #0066b8;
    }

    .toolbar button.danger {
      background: #fff;
      color: #c42b1c;
      border-color: #d08078;
    }

    .tb-separator {
      width: 1px;
      background: #d0d0d0;
      margin: 2px 4px;
      align-self: stretch;
    }

    .family-selector {
      padding: 4px 8px;
      border: 1px solid #c0c0c0;
      border-radius: 4px;
      font-size: 12px;
      background: #fff;
      cursor: pointer;
    }

    .main-body {
      display: flex;
      flex: 1;
      overflow: auto;
      position: relative;
      min-height: 0;
    }

    .sash {
      width: 5px;
      background: #e0e0e0;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .sash:hover,
    .sash.active {
      background: #0078d4;
    }

    .tree-panel {
      background: var(--bg-tree);
      overflow: auto;
      flex-shrink: 0;
      min-width: 180px;
      padding: 6px 0;
    }

    .tree-node {
      cursor: pointer;
      white-space: nowrap;
      padding: 4px 8px 4px 4px;
      margin: 1px 2px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
    }

    .tree-node:hover {
      background: var(--hover-bg);
    }

    .tree-node.selected {
      background: var(--highlight-bg);
      color: var(--highlight-text);
    }

    .tree-arrow {
      width: 16px;
      height: 16px;
      font-size: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #555;
    }

    .tree-arrow.expanded {
      transform: rotate(90deg);
    }

    .tree-arrow.no-children {
      visibility: hidden;
    }

    .tree-icon {
      width: 18px;
      height: 18px;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tree-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fafafa;
      min-width: 300px;
    }

    .detail-header {
      background: #f5f5f5;
      border-bottom: 1px solid #d8d8d8;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .key-icon {
      font-size: 16px;
    }

    .key-path {
      color: #888;
      font-size: 11.5px;
      font-family: var(--font-mono);
      flex: 1;
    }

    .tab-bar {
      display: flex;
      background: #f5f5f5;
      border-bottom: 1px solid #d8d8d8;
      padding: 0 10px;
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 9px 18px;
      cursor: pointer;
      border: none;
      background: transparent;
      font-size: 12.5px;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: all 0.15s;
      margin-bottom: -1px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: #333;
      background: #eef2f7;
    }

    .tab-btn.active {
      color: #0078d4;
      border-bottom-color: #0078d4;
      font-weight: 600;
      background: #fafafa;
    }

    .tab-content {
      flex: 1;
      overflow: auto;
      display: none;
      padding: 4px;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
    }

    .attr-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .attr-table th {
      background: #f0f0f0;
      border: 1px solid #d0d0d0;
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      position: sticky;
      top: 0;
    }

    .attr-table td {
      border: 1px solid #e0e0e0;
      padding: 7px 12px;
      color: #333;
    }

    .col-name {
      font-family: var(--font-mono);
      font-weight: 500;
      width: 35%;
    }

    .col-data {
      width: 65%;
      cursor: pointer;
    }

    .col-data input,
    .col-data textarea,
    .col-data select {
      width: 100%;
      padding: 6px 8px;
      border: 2px solid #0078d4;
      border-radius: 4px;
      font-size: 12.5px;
      font-family: var(--font-family);
    }

    .col-data textarea {
      resize: vertical;
      min-height: 60px;
    }

    .child-link {
      color: #0078d4;
      cursor: pointer;
      text-decoration: underline;
      margin-right: 4px;
    }

    .child-link:hover {
      color: #005a9e;
    }

    .sort-btn {
      margin-left: 8px;
      cursor: pointer;
      color: #0078d4;
      font-size: 12px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #aaa;
      gap: 8px;
    }

    .org-chart {
      flex: 1;
      overflow: auto;
      padding: 20px 30px;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      background: #ffffff;
      border-radius: 6px;
    }

    .org-tree {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      min-width: max-content;
      transform-origin: top left;
      transition: transform 0.2s ease;
      background: #ffffff;
    }

    .org-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      min-width: 100px;
      text-align: center;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      background: #fff;
      position: relative;
      z-index: 2;
      margin: 4px 8px;
      white-space: nowrap;
    }

    .org-node:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .org-node.node-self {
      border-color: var(--color-self);
      background: #e8f4fd;
    }

    .org-node.node-other {
      border-color: var(--color-other);
      background: #f4fdf7;
    }

    .org-node.node-spouse {
      border-color: var(--color-spouse);
      background: #fef5e7;
    }

    .org-node .node-name {
      font-weight: 600;
      font-size: 13px;
    }

    .org-node .node-years {
      font-size: 9px;
      color: #aaa;
    }

    .org-children {
      display: flex;
      justify-content: center;
      position: relative;
      padding-top: 30px;
    }

    .org-node.has-children::after {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 50%;
      width: 2px;
      height: 18px;
      background: var(--org-line-color);
      z-index: 1;
    }

    .org-children.multiple::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--org-line-color);
      z-index: 1;
    }

    .org-branch {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .org-branch::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 50%;
      width: 2px;
      height: 20px;
      background: var(--org-line-color);
      z-index: 1;
    }

    .spouse-pair {
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .spouse-pair::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--color-spouse);
      z-index: 1;
    }

    .sibling-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 0;
      flex-direction: row-reverse;
    }

    .view-mode-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 8px 12px;
      background: #f0f3f7;
      border-bottom: 1px solid #d8d8d8;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .view-mode-bar button {
      padding: 4px 12px;
      border: 1px solid #b0b0b0;
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.12s;
      white-space: nowrap;
    }

    .view-mode-bar button.active {
      background: #0078d4;
      color: #fff;
      border-color: #0066b8;
      font-weight: 500;
    }

    .graph-legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px 14px;
      border-top: 1px solid #e8e8e8;
      background: #fafafa;
      font-size: 11px;
      color: #666;
      flex-shrink: 0;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 4px;
      vertical-align: middle;
    }

    .status-bar {
      background: #f0f0f0;
      border-top: 1px solid #d0d0d0;
      padding: 5px 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11.5px;
      color: #666;
      flex-shrink: 0;
    }

    .status-path {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-count {
      flex-shrink: 0;
    }

    .copyright-bar {
      background: #e8e8e8;
      border-top: 1px solid #d0d0d0;
      padding: 5px 14px;
      font-size: 10.5px;
      color: #888;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .context-menu {
      position: fixed;
      background: #fafafa;
      border: 1px solid #b0b0b0;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      z-index: 2000;
      min-width: 200px;
      padding: 4px 0;
      display: none;
    }

    .context-menu.show {
      display: block;
    }

    .cm-item {
      padding: 8px 18px;
      cursor: pointer;
      font-size: 12.5px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .cm-item:hover {
      background: #e0e8f4;
    }

    .cm-item.danger {
      color: #c42b1c;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-dialog {
      background: #fafafa;
      border: 1px solid #999;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      width: 500px;
      max-width: 95vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      background: #f0f0f0;
      border-bottom: 1px solid #d0d0d0;
      padding: 12px 18px;
      font-weight: 600;
    }

    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      background: #f5f5f5;
      border-top: 1px solid #d8d8d8;
      padding: 12px 18px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-primary {
      background: #0078d4;
      color: #fff;
      border-color: #0066b8;
    }

    .btn-cancel {
      background: #e8e8e8;
      color: #333;
    }

    .undo-bar,
    .info-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: #fff3cd;
      border-bottom: 1px solid #ffc107;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #856404;
      z-index: 10;
    }

    .undo-bar button,
    .info-bar button {
      background: #0078d4;
      color: #fff;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-left: auto;
    }

    body.mobile-layout .main-body {
      flex-direction: column;
    }

    body.mobile-layout .tree-panel {
      max-height: 35vh;
    }

    body.mobile-layout .sash {
      display: none;
    }

    .sort-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
    }

    .sort-item span {
      flex: 1;
    }

    .sort-item button {
      padding: 2px 8px;
      margin-left: 4px;
    }

    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      font-size: 12px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="app-window" id="appWindow">
    <div class="title-bar">
      <div class="app-icon">林</div>
      <span class="app-title">族谱管理系统 <span class="app-version">v1.0</span></span>
    </div>
    <div class="menu-bar">
      <div class="menu-item" data-menu="file" id="menuFile">文件
        <div class="dropdown-menu" id="dropdownFile">
          <div class="dm-item" onclick="exportData()">📤 导出所有家族</div>
          <div class="dm-item" onclick="importData()">📥 导入</div>
          <div class="dm-item" onclick="syncToCloud()">☁️ 上传到云端</div>
          <div class="dm-item" onclick="loadFromCloud()">☁️ 从云端加载</div>
          <div class="dm-item danger" onclick="resetAllData()">🗑️ 重置全部</div>
        </div>
      </div>
      <div class="menu-item" data-menu="edit" id="menuEdit">编辑
        <div class="dropdown-menu" id="dropdownEdit">
          <div class="dm-item" onclick="addChildMember()">➕ 添加子成员</div>
          <div class="dm-item" onclick="addSiblingMember()">👥 添加兄弟</div>
          <div class="dm-item" onclick="addAttribute()">📝 添加信息</div>
          <div class="dm-item danger" onclick="deleteSelectedMember()">🗑️ 删除成员</div>
        </div>
      </div>
      <div class="menu-item" id="menuSearch" onclick="openSearchDialog()">🔍 搜索</div>
      <span class="separator"></span>
      <div class="menu-item" onclick="openFamilyManageDialog()">👨‍👩‍👧‍👦 家族管理</div>
      <div class="menu-item" onclick="showHelp()">帮助</div>
    </div>
    <div class="toolbar">
      <select class="family-selector" id="familySelector" onchange="switchFamily(this.value)">
      </select>
      <span class="tb-separator"></span>
      <button onclick="openPrefaceDialog()">📜 序言</button>
      <span class="tb-separator"></span>
      <button class="primary" onclick="addChildMember()">➕ 添加子成员</button>
      <button onclick="addSiblingMember()">👥 添加兄弟</button>
      <span class="tb-separator"></span>
      <button onclick="addAttribute()">📝 添加信息</button>
      <button onclick="deleteAttribute()">🗑️ 删除信息</button>
      <span class="tb-separator"></span>
      <button class="danger" onclick="deleteSelectedMember()">⚠️ 删除成员</button>
      <button onclick="openSortDialog()" title="手动调整子女顺序">↕️ 子女排序</button>
      <span class="tb-separator"></span>
      <button onclick="expandAllNodes()">📂 全部展开</button>
      <button onclick="collapseAllNodes()">📁 全部折叠</button>
    </div>
    <div class="main-body" id="mainBody">
      <div class="tree-panel" id="treePanel">
        <div id="treeRoot"></div>
      </div>
      <div class="sash" id="sash"></div>
      <div class="detail-panel" id="detailPanel">
        <div class="detail-header">
          <span class="key-icon">📄</span>
          <span id="detailTitle">请选择一个成员</span>
          <span class="key-path" id="detailPath"></span>
        </div>
        <div class="tab-bar">
          <button class="tab-btn active" data-tab="properties" onclick="switchTab('properties')">📋 个人信息</button>
          <button class="tab-btn" data-tab="relation" onclick="switchTab('relation')">🔗 辈分关系图</button>
        </div>
        <div class="tab-content active" id="tab-properties">
          <div class="empty-state" id="emptyState"><span class="empty-icon">👈</span><span>在左侧选择成员</span></div>
          <table class="attr-table" id="attrTable" style="display:none;">
            <thead><tr><th>名称</th><th>数据</th></tr></thead>
            <tbody id="attrTableBody"></tbody>
          </table>
        </div>
        <div class="tab-content" id="tab-relation">
          <div class="view-mode-bar" id="viewModeBar">
            <div>
              <span>查看范围：</span>
              <button data-mode="full" class="active" onclick="setViewMode('full')">全图</button>
              <button data-mode="two" onclick="setViewMode('two')">上下各2代</button>
              <button data-mode="siblings" onclick="setViewMode('siblings')">同辈</button>
              <button data-mode="custom" onclick="setViewMode('custom')">自定义</button>
            </div>
            <div>
              <span>缩放：</span><button onclick="zoomIn()">➕</button><button onclick="zoomOut()">➖</button>
              <button onclick="zoomToFit()" id="btnFitScreen">适应屏幕</button>
              <button onclick="zoomReset()" id="btnOriginalSize">原始尺寸</button>
              <button onclick="exportChartImage()" title="导出完整辈分关系图">📷 导出图片</button>
            </div>
          </div>
          <div class="org-chart" id="orgChartContainer">
            <div class="empty-state" id="relationEmpty"><span>请选择一个成员</span></div>
            <div class="org-tree" id="orgTree" style="display:none;"></div>
          </div>
          <div class="graph-legend">
            <span><span class="legend-dot" style="background:#e8f4fd;border:1px solid #0078d4;"></span> 当前成员</span>
            <span><span class="legend-dot" style="background:#f4fdf7;border:1px solid #27ae60;"></span> 其他成员</span>
            <span><span class="legend-dot" style="background:#fef5e7;border:1px solid #e67e22;"></span> 配偶</span>
          </div>
        </div>
      </div>
    </div>
    <div class="status-bar">
      <span>📍 代际：</span><span class="status-path" id="statusPath">族谱管理系统</span>
      <span class="status-count" id="statusCount">共 0 位成员</span>
    </div>
    <div class="copyright-bar">
      <span>版权所有©2026 林及第</span>
      <span>|</span>
      <span>联系方式：ld-1212@163.com</span>
    </div>
  </div>
  <div class="context-menu" id="contextMenu">
    <div class="cm-item" onclick="addChildMember()">➕ 添加子成员</div>
    <div class="cm-item" onclick="addSiblingMember()">👥 添加兄弟</div>
    <div class="cm-item" onclick="addAttribute()">📝 添加信息</div>
    <div class="cm-item danger" onclick="deleteSelectedMember()">🗑️ 删除</div>
  </div>
  <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="handleFileImport(event)">
  <script>
    (function() {
      const STORAGE_KEY = 'jiumu_family_multi_v3';
      let appData = { families: [], currentFamilyId: null };
      let selectedNodeId = null;
      let expandedNodeIds = new Set();
      let currentTab = 'properties';
      let relationViewMode = 'full';
      let currentScale = 1;
      let customUp = 2, customDown = 2;
      let pendingDelete = null;
      let autoFitEnabled = false;

      if (/Mobi|Android/i.test(navigator.userAgent)) document.body.classList.add('mobile-layout');

      function generateId() {
        return 'n' + Date.now() + Math.random().toString(36).substr(2, 8);
      }

      function getCurrentFamily() {
        if (!appData.currentFamilyId || appData.families.length === 0) return null;
        return appData.families.find(f => f.id === appData.currentFamilyId) || null;
      }

      function getCurrentRoot() {
        const fam = getCurrentFamily();
        return fam ? fam.root : null;
      }

      function createDefaultFamily() {
        const root = {
          id: 'root',
          name: '族谱管理系统',
          isRoot: true,
          children: []
        };
        const ancestor = {
          id: generateId(),
          name: '林始祖',
          attributes: [{ name: '性别', value: '男' }, { name: '出生日期', value: '1520-03-15' }, { name: '配偶', value: '陈氏' }, { name: '出生地', value: '福建莆田' }],
          children: []
        };
        root.children.push(ancestor);
        let total = 1;
        const chars = ['建','文','明','龙','伟','强','志','宇','浩','博','健','泽','瑞','荣','华','国','家','兴','盛','德','仁','义','礼','智','信','孝','忠','勇','贤','良'];
        const places = ['福建莆田','福建厦门','福建福州','福建泉州','福建漳州'];
        function rInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
        function gen(node, depth){
          if(depth>=7||total>=300) return;
          let maxSons = depth<2?Math.min(8,300-total):(depth<4?Math.min(6,300-total):Math.min(4,300-total));
          for(let i=0;i<rInt(1,Math.max(1,maxSons));i++){
            if(total>=300) break;
            const given = chars[rInt(0,chars.length-1)]+(Math.random()>0.6?chars[rInt(0,chars.length-1)]:'');
            const birthYear = 1520+depth*28+rInt(0,25);
            const birthDate = birthYear+'-'+(rInt(1,12)+'').padStart(2,'0')+'-'+(rInt(1,28)+'').padStart(2,'0');
            const spouse = Math.random()>0.4?['陈','王','李','张','黄','吴','郑'][rInt(0,6)]+'氏':'';
            const son = { id:generateId(), name:'林'+given, attributes:[{name:'性别',value:'男'},{name:'出生日期',value:birthDate},{name:'配偶',value:spouse},{name:'出生地',value:places[rInt(0,places.length-1)]}], children:[] };
            node.children.push(son); total++; gen(son,depth+1);
          }
        }
        gen(ancestor,1);
        return { id: generateId(), name: '林氏家族', root: root, preface: '' };
      }

      function loadData() {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) {
          try {
            appData = JSON.parse(s);
            if (!appData.families || !Array.isArray(appData.families)) throw new Error();
            appData.families.forEach(f => { if (f.preface === undefined) f.preface = ''; });
            if (appData.families.length === 0) {
              const fam = createDefaultFamily();
              appData.families.push(fam);
              appData.currentFamilyId = fam.id;
            } else if (!appData.currentFamilyId || !appData.families.find(f=>f.id===appData.currentFamilyId)) {
              appData.currentFamilyId = appData.families[0].id;
            }
          } catch (e) {
            appData = { families: [], currentFamilyId: null };
            const fam = createDefaultFamily();
            appData.families.push(fam);
            appData.currentFamilyId = fam.id;
          }
        } else {
          const fam = createDefaultFamily();
          appData.families = [fam];
          appData.currentFamilyId = fam.id;
        }
        saveData();
        updateFamilySelector();
      }

      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        updateStatusBar();
      }

      function updateFamilySelector() {
        const sel = document.getElementById('familySelector');
        if (!sel) return;
        sel.innerHTML = '';
        appData.families.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.id;
          opt.textContent = f.name;
          if (f.id === appData.currentFamilyId) opt.selected = true;
          sel.appendChild(opt);
        });
      }

      window.switchFamily = function(familyId) {
        if (!familyId || familyId === appData.currentFamilyId) return;
        appData.currentFamilyId = familyId;
        selectedNodeId = null;
        expandedNodeIds.clear();
        const root = getCurrentRoot();
        if (root) expandedNodeIds.add(root.id);
        saveData();
        renderTree();
        refreshDetailView();
        updateFamilySelector();
      };

      function openPrefaceDialog() {
        const fam = getCurrentFamily();
        if (!fam) return;
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
          <div class="modal-dialog" style="width:600px; max-width:95vw;">
            <div class="modal-header">📜 家族序言 - ${escapeHtml(fam.name)}</div>
            <div class="modal-body">
              <textarea id="prefaceTextarea" style="width:100%; height:300px; padding:10px; font-size:13px; resize:vertical; border:1px solid #ccc; border-radius:4px;">${escapeHtml(fam.preface || '')}</textarea>
            </div>
            <div class="modal-footer">
              <button class="btn-cancel" id="prefaceCancel">取消</button>
              <button class="btn-primary" id="prefaceSave">保存</button>
            </div>
          </div>`;
        document.body.appendChild(overlay);
        overlay.querySelector('#prefaceCancel').onclick = () => overlay.remove();
        overlay.querySelector('#prefaceSave').onclick = () => {
          const textarea = overlay.querySelector('#prefaceTextarea');
          fam.preface = textarea.value;
          saveData();
          overlay.remove();
          showInfoBar('序言已保存');
        };
      }

      function openFamilyManageDialog() {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        let listHtml = appData.families.map(f => `
          <div style="display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee;">
            <span style="flex:1;">${escapeHtml(f.name)} ${f.id === appData.currentFamilyId ? '(当前)' : ''}</span>
            <div>
              <button data-action="switch" data-id="${f.id}" style="margin-right:4px;">切换</button>
              <button data-action="rename" data-id="${f.id}" style="margin-right:4px;">重命名</button>
              <button data-action="delete" data-id="${f.id}" style="color:#c42b1c;" ${appData.families.length<=1?'disabled':''}>删除</button>
            </div>
          </div>
        `).join('');
        overlay.innerHTML = `
          <div class="modal-dialog" style="width:500px;">
            <div class="modal-header">家族管理</div>
            <div class="modal-body">
              <div style="margin-bottom:12px;">
                <button id="newFamilyBtn" class="btn-primary" style="padding:6px 12px;">➕ 新建家族</button>
              </div>
              <div id="familyList">${listHtml}</div>
            </div>
            <div class="modal-footer"><button class="btn-cancel" id="closeManage">关闭</button></div>
          </div>`;
        document.body.appendChild(overlay);
        overlay.querySelector('#closeManage').onclick = () => overlay.remove();
        overlay.querySelector('#newFamilyBtn').onclick = () => {
          const name = prompt('请输入新家族名称：');
          if (name && name.trim()) {
            const newRoot = { id: 'root', name: name.trim(), isRoot: true, children: [] };
            const newFam = { id: generateId(), name: name.trim(), root: newRoot, preface: '' };
            appData.families.push(newFam);
            appData.currentFamilyId = newFam.id;
            selectedNodeId = null;
            expandedNodeIds.clear();
            expandedNodeIds.add(newRoot.id);
            saveData();
            renderTree();
            refreshDetailView();
            updateFamilySelector();
            overlay.remove();
          }
        };
        overlay.querySelector('#familyList').addEventListener('click', (e) => {
          const btn = e.target.closest('button');
          if (!btn) return;
          const action = btn.dataset.action;
          const fid = btn.dataset.id;
          if (action === 'switch') {
            switchFamily(fid);
            overlay.remove();
          } else if (action === 'rename') {
            const fam = appData.families.find(f => f.id === fid);
            if (!fam) return;
            const newName = prompt('新名称：', fam.name);
            if (newName && newName.trim()) {
              fam.name = newName.trim();
              saveData();
              updateFamilySelector();
              renderTree();
              refreshDetailView();
              overlay.querySelector('#familyList').innerHTML = appData.families.map(f => `
                <div style="display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee;">
                  <span style="flex:1;">${escapeHtml(f.name)} ${f.id === appData.currentFamilyId ? '(当前)' : ''}</span>
                  <div>
                    <button data-action="switch" data-id="${f.id}" style="margin-right:4px;">切换</button>
                    <button data-action="rename" data-id="${f.id}" style="margin-right:4px;">重命名</button>
                    <button data-action="delete" data-id="${f.id}" style="color:#c42b1c;" ${appData.families.length<=1?'disabled':''}>删除</button>
                  </div>
                </div>
              `).join('');
            }
          } else if (action === 'delete') {
            if (appData.families.length <= 1) {
              alert('至少保留一个家族');
              return;
            }
            const fam = appData.families.find(f => f.id === fid);
            if (!fam) return;
            if (confirm(`确定删除家族「${fam.name}」及其所有数据吗？`)) {
              appData.families = appData.families.filter(f => f.id !== fid);
              if (appData.currentFamilyId === fid) {
                appData.currentFamilyId = appData.families[0].id;
              }
              selectedNodeId = null;
              expandedNodeIds.clear();
              const root = getCurrentRoot();
              if (root) expandedNodeIds.add(root.id);
              saveData();
              renderTree();
              refreshDetailView();
              updateFamilySelector();
              overlay.querySelector('#familyList').innerHTML = appData.families.map(f => `
                <div style="display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee;">
                  <span style="flex:1;">${escapeHtml(f.name)} ${f.id === appData.currentFamilyId ? '(当前)' : ''}</span>
                  <div>
                    <button data-action="switch" data-id="${f.id}" style="margin-right:4px;">切换</button>
                    <button data-action="rename" data-id="${f.id}" style="margin-right:4px;">重命名</button>
                    <button data-action="delete" data-id="${f.id}" style="color:#c42b1c;" ${appData.families.length<=1?'disabled':''}>删除</button>
                  </div>
                </div>
              `).join('');
            }
          }
        });
      }

      function findNodeById(node, id) {
        if (node.id === id) return node;
        if (node.children) for (const c of node.children) { const f = findNodeById(c, id); if (f) return f; }
        return null;
      }

      function findParentNode(root, targetId) {
        if (!root.children) return null;
        for (const c of root.children) { if (c.id === targetId) return root; const f = findParentNode(c, targetId); if (f) return f; }
        return null;
      }

      function countMembers(node) { let c = node.isRoot ? 0 : 1; if (node.children) for (const ch of node.children) c += countMembers(ch); return c; }

      function getAttr(node, name) { if (!node || !node.attributes) return ''; const a = node.attributes.find(a => a.name === name); return a ? a.value : ''; }

      function setAttr(node, name, value) { if (!node.attributes) node.attributes = []; const a = node.attributes.find(a => a.name === name); if (a) a.value = value; else node.attributes.push({ name, value }); }

      function isMale(node) { return getAttr(node, '性别') !== '女'; }

      function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

      function sortByBirthDateDesc(nodes) {
        return nodes.sort((a, b) => { const dateA = getAttr(a, '出生日期') || '0000-00-00'; const dateB = getAttr(b, '出生日期') || '0000-00-00'; return dateA.localeCompare(dateB); });
      }

      function isDateValid(dateStr) {
        if (!dateStr) return true;
        const parts = dateStr.split('-');
        if (parts.length !== 3) return false;
        const year = parseInt(parts[0]), month = parseInt(parts[1]), day = parseInt(parts[2]);
        if (isNaN(year) || isNaN(month) || isNaN(day)) return false;
        if (month < 1 || month > 12 || day < 1 || day > 31) return false;
        const inputDate = new Date(year, month - 1, day);
        if (inputDate.getFullYear() !== year || inputDate.getMonth() !== month - 1 || inputDate.getDate() !== day) return false;
        const today = new Date(); today.setHours(0,0,0,0);
        return inputDate <= today;
      }

      function getNodePath(node) {
        const path = [];
        let current = node;
        const root = getCurrentRoot();
        while (current) {
          if (!current.isRoot) path.unshift(current.name);
          current = findParentNode(root, current.id);
        }
        return path;
      }

      function renderTree() {
        const treeRoot = document.getElementById('treeRoot');
        treeRoot.innerHTML = '';
        const root = getCurrentRoot();
        if (!root) return;
        function renderNode(node, depth, cont) {
          const div = document.createElement('div');
          div.className = 'tree-node';
          div.style.paddingLeft = (depth * 20 + 4) + 'px';
          div.dataset.nodeId = node.id;
          if (node.id === selectedNodeId) div.classList.add('selected');
          const hasChildren = node.children && node.children.length > 0;
          const arrow = document.createElement('span');
          arrow.className = 'tree-arrow';
          arrow.textContent = '▶';
          if (!hasChildren) arrow.classList.add('no-children');
          else if (expandedNodeIds.has(node.id)) arrow.classList.add('expanded');
          arrow.onclick = e => { e.stopPropagation(); if (hasChildren) toggleExpand(node.id); };
          div.appendChild(arrow);
          const icon = document.createElement('span');
          icon.className = 'tree-icon';
          icon.textContent = node.isRoot ? '🏠' : (hasChildren ? '📁' : '👤');
          div.appendChild(icon);
          div.appendChild(document.createTextNode(node.name));
          div.onclick = e => { selectNode(node.id); };
          div.oncontextmenu = e => { e.preventDefault(); showContextMenu(e.clientX, e.clientY, node); };
          cont.appendChild(div);
          if (hasChildren && expandedNodeIds.has(node.id)) {
            const cc = document.createElement('div');
            cc.className = 'tree-children';
            const sortedChildren = sortByBirthDateDesc([...node.children]);
            for (const c of sortedChildren) renderNode(c, depth + 1, cc);
            cont.appendChild(cc);
          }
          if (node.id === selectedNodeId) {
            setTimeout(() => { div.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
          }
        }
        renderNode(root, 0, treeRoot);
        if (!expandedNodeIds.has(root.id)) { expandedNodeIds.add(root.id); renderTree(); return; }
        updateStatusBar();
      }

      function toggleExpand(id) { if (expandedNodeIds.has(id)) expandedNodeIds.delete(id); else expandedNodeIds.add(id); renderTree(); if (selectedNodeId) refreshDetailView(); }

      function selectNode(id) { selectedNodeId = id; refreshDetailView(); renderTree(); updateStatusBar(); }

      function refreshDetailView() {
        const root = getCurrentRoot();
        const n = selectedNodeId && root ? findNodeById(root, selectedNodeId) : null;
        if (currentTab === 'properties') renderDetailPanel(n);
        else renderOrgChart(n);
      }

      function renderDetailPanel(node) {
        document.getElementById('detailTitle').textContent = node ? '👤 ' + node.name : '请选择一个成员';
        if (node && !node.isRoot) {
          const path = getNodePath(node);
          document.getElementById('detailPath').textContent = '代际: ' + path.join(' > ');
        } else {
          document.getElementById('detailPath').textContent = '';
        }
        const empty = document.getElementById('emptyState'), table = document.getElementById('attrTable'), tbody = document.getElementById('attrTableBody');
        if (!node || node.isRoot) { empty.style.display = 'flex'; table.style.display = 'none'; return; }
        empty.style.display = 'none'; table.style.display = 'table'; tbody.innerHTML = '';
        const sons = node.children ? node.children.filter(c => getAttr(c, '性别') === '男') : [];
        const daughters = node.children ? node.children.filter(c => getAttr(c, '性别') === '女') : [];
        const sonsHtml = sons.length ? sons.map(c => `<span class="child-link" data-child-id="${c.id}">${escapeHtml(c.name)}</span>`).join('、') : '（无）';
        const daughtersHtml = daughters.length ? daughters.map(c => `<span class="child-link" data-child-id="${c.id}">${escapeHtml(c.name)}</span>`).join('、') : '（无）';
        const fixedFields = [
          { name: '姓名', value: node.name, attr: null, type: 'text' },
          { name: '性别', value: getAttr(node, '性别'), attr: '性别', type: 'select' },
          { name: '出生日期', value: getAttr(node, '出生日期'), attr: '出生日期', type: 'date' },
          { name: '出生地', value: getAttr(node, '出生地'), attr: '出生地', type: 'text' },
          { name: '配偶', value: getAttr(node, '配偶'), attr: '配偶', type: 'text' },
          { name: '子', value: sonsHtml, attr: null, editable: false, isHtml: true },
          { name: '女', value: daughtersHtml, attr: null, editable: false, isHtml: true }
        ];
        const customFields = [];
        if (node.attributes) {
          node.attributes.forEach((attr, idx) => {
            if (fixedFields.some(f => f.attr === attr.name || f.name === attr.name)) return;
            if (attr.name === '职业' || attr.name === '简介' || attr.name === '备注') return;
            customFields.push({ name: attr.name, value: attr.value, idx });
          });
        }
        const trailingFields = [
          { name: '职业', value: getAttr(node, '职业'), attr: '职业', type: 'text' },
          { name: '简介', value: getAttr(node, '简介'), attr: '简介', type: 'textarea' },
          { name: '备注', value: getAttr(node, '备注'), attr: '备注', type: 'textarea' }
        ];
        const allRows = [...fixedFields, ...customFields.map(c => ({ name: c.name, value: c.value, attr: c.name, customIdx: c.idx, type: 'text' })), ...trailingFields];
        allRows.forEach(f => {
          const tr = document.createElement('tr');
          const tdName = document.createElement('td'); tdName.className = 'col-name'; tdName.textContent = f.name;
          const tdData = document.createElement('td'); tdData.className = 'col-data'; tdData.setAttribute('data-field', f.name);
          if (f.isHtml) { tdData.innerHTML = f.value; }
          else { tdData.innerHTML = `<span class="data-text">${escapeHtml(f.value || '（空）')}</span>`; }
          tr.appendChild(tdName); tr.appendChild(tdData);
          if (f.editable !== false) {
            tdData.addEventListener('dblclick', () => {
              if (f.isHtml) return;
              if (f.customIdx !== undefined) startEditingCustom(tr, f.customIdx, node);
              else startEditing(tr, f.name, node, f.attr, f.type);
            });
          }
          tbody.appendChild(tr);
        });
        tbody.querySelectorAll('.child-link').forEach(link => {
          link.addEventListener('click', (e) => {
            e.stopPropagation();
            const childId = link.dataset.childId;
            if (childId) {
              const root = getCurrentRoot();
              const childNode = findNodeById(root, childId);
              if (childNode) {
                let p = childNode;
                while (p) { const par = findParentNode(root, p.id); if (par) expandedNodeIds.add(par.id); p = par; }
                expandedNodeIds.add(childId);
                selectNode(childId);
                switchTab('properties');
              }
            }
          });
        });
      }

      function startEditing(tr, fieldName, node, attrName, fieldType) {
        const td = tr.querySelector('.col-data');
        if (td.querySelector('input, textarea, select')) return;
        const currentVal = fieldName === '姓名' ? node.name : (attrName ? getAttr(node, attrName) : '');
        let input;
        if (fieldType === 'select') {
          input = document.createElement('select');
          input.innerHTML = '<option value="男">男</option><option value="女">女</option>';
          input.value = (currentVal === '男' || currentVal === '女') ? currentVal : '男';
        } else if (fieldType === 'date') {
          input = document.createElement('input'); input.type = 'date'; input.value = currentVal || '';
        } else if (fieldType === 'textarea') {
          input = document.createElement('textarea'); input.value = currentVal || ''; input.style.height = 'auto'; input.style.minHeight = '60px';
        } else {
          input = document.createElement('input'); input.type = 'text'; input.value = currentVal || '';
        }
        input.style.width = '100%'; td.innerHTML = ''; td.appendChild(input); input.focus();
        const save = () => {
          let newVal = input.value.trim();
          if (fieldType === 'select') { if (newVal !== '男' && newVal !== '女') { alert('性别只能是"男"或"女"'); input.focus(); return; } }
          if (fieldType === 'date') { if (newVal && !isDateValid(newVal)) { alert('出生日期不能晚于今天，且格式需为YYYY-MM-DD'); input.focus(); return; } }

      function expandAllNodes() { const root = getCurrentRoot(); if (!root) return; function c(n) { if (n.children && n.children.length) { expandedNodeIds.add(n.id); n.children.forEach(c); } } c(root); expandedNodeIds.add(root.id); renderTree(); }
      function collapseAllNodes() { expandedNodeIds.clear(); const root = getCurrentRoot(); if (root) expandedNodeIds.add(root.id); renderTree(); }

      function exportData() {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(appData, null, 2)]));
        a.download = '族谱管理系统.json';
        a.click();
      }

      function importData() { document.getElementById('fileInput').click(); }

      function handleFileImport(e) {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.families && Array.isArray(data.families)) {
              appData = data;
              appData.families.forEach(f => { if (f.preface === undefined) f.preface = ''; });
              if (appData.families.length === 0) { const fam = createDefaultFamily(); appData.families.push(fam); appData.currentFamilyId = fam.id; }
              else if (!appData.currentFamilyId || !appData.families.find(f=>f.id===appData.currentFamilyId)) { appData.currentFamilyId = appData.families[0].id; }
            } else if (data.isRoot) {
              const fam = { id: generateId(), name: '导入的家族', root: data, preface: '' };
              appData = { families: [fam], currentFamilyId: fam.id };
            } else {
              throw new Error();
            }
            selectedNodeId = null; expandedNodeIds.clear();
            const root = getCurrentRoot(); if (root) expandedNodeIds.add(root.id);
            saveData(); renderTree(); refreshDetailView(); updateFamilySelector(); switchTab('properties');
          } catch (ex) { alert('文件格式错误'); }
        };
        r.readAsText(f);
      }

      function resetAllData() {
        if (confirm('重置所有家族数据？此操作不可恢复！')) {
          const fam = createDefaultFamily();
          appData = { families: [fam], currentFamilyId: fam.id };
          selectedNodeId = null; expandedNodeIds.clear();
          const root = getCurrentRoot(); if (root) expandedNodeIds.add(root.id);
          saveData(); renderTree(); refreshDetailView(); updateFamilySelector(); switchTab('properties');
        }
      }

      // 云端 API 地址（相对路径，使用 Pages Functions）
      const CLOUD_API_URL = '/api/data';

      // 上传本地数据到云端
      async function syncToCloud() {
        const data = JSON.stringify(appData);
        showInfoBar('正在上传到云端...', 0);
        try {
          const response = await fetch(CLOUD_API_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: data
          });
          if (response.ok) {
            showInfoBar('✅ 上传成功！数据已同步至云端', 3000);
          } else {
            const err = await response.json();
            showInfoBar(`❌ 上传失败: ${err.error}`, 3000);
          }
        } catch (e) {
          showInfoBar(`❌ 网络错误: ${e.message}`, 3000);
        }
      }

      // 从云端下载数据并覆盖本地（手动确认）
      async function loadFromCloud() {
        if (!confirm('从云端加载将覆盖当前所有数据，确定继续吗？')) return;
        showInfoBar('正在从云端加载...', 0);
        try {
          const response = await fetch(CLOUD_API_URL);
          if (!response.ok) {
            const err = await response.json();
            showInfoBar(`❌ 加载失败: ${err.error}`, 3000);
            return;
          }
          const cloudData = await response.json();
          if (cloudData.families && Array.isArray(cloudData.families)) {
            appData = cloudData;
            appData.families.forEach(f => { if (f.preface === undefined) f.preface = ''; });
            if (appData.families.length === 0) {
              const fam = createDefaultFamily();
              appData.families.push(fam);
              appData.currentFamilyId = fam.id;
            } else if (!appData.families.find(f => f.id === appData.currentFamilyId)) {
              appData.currentFamilyId = appData.families[0].id;
            }
          } else {
            showInfoBar('❌ 云端数据格式错误', 3000);
            return;
          }
          selectedNodeId = null;
          expandedNodeIds.clear();
          const root = getCurrentRoot();
          if (root) expandedNodeIds.add(root.id);
          saveData();
          renderTree();
          refreshDetailView();
          updateFamilySelector();
          switchTab('properties');
          showInfoBar('✅ 云端数据加载成功', 3000);
        } catch (e) {
          showInfoBar(`❌ 网络错误: ${e.message}`, 3000);
        }
      }

      // 启动时自动从云端同步（无弹窗）
      async function autoSyncOnStartup() {
        try {
          const response = await fetch(CLOUD_API_URL);
          if (!response.ok) return; // 云端无数据或网络不通，静默放弃

          const cloudData = await response.json();
          if (!cloudData.families || !Array.isArray(cloudData.families)) return;

          // 用云端数据替换本地数据
          appData = cloudData;
          appData.families.forEach(f => { if (f.preface === undefined) f.preface = ''; });
          if (appData.families.length === 0) {
            const fam = createDefaultFamily();
            appData.families.push(fam);
            appData.currentFamilyId = fam.id;
          } else if (!appData.families.find(f => f.id === appData.currentFamilyId)) {
            appData.currentFamilyId = appData.families[0].id;
          }

          // 刷新界面
          selectedNodeId = null;
          expandedNodeIds.clear();
          const root = getCurrentRoot();
          if (root) expandedNodeIds.add(root.id);
          saveData();           // 同步到 localStorage
          renderTree();
          refreshDetailView();
          updateFamilySelector();
          // 静默成功，不弹提示
        } catch (e) {
          // 网络错误，静默放弃，使用本地数据
        }
      }

      function updateStatusBar() {
        const root = getCurrentRoot();
        const fam = getCurrentFamily();
        if (selectedNodeId && root) {
          const node = findNodeById(root, selectedNodeId);
          if (node && !node.isRoot) {
            const path = getNodePath(node);
            document.getElementById('statusPath').textContent = path.join(' > ');
          } else {
            document.getElementById('statusPath').textContent = fam ? fam.name : '族谱管理系统';
          }
        } else {
          document.getElementById('statusPath').textContent = fam ? fam.name : '族谱管理系统';
        }
        document.getElementById('statusCount').textContent = '共 ' + (root ? countMembers(root) : 0) + ' 位成员';
      }

      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
        if (e.key === 'Delete') { e.preventDefault(); if (selectedNodeId) deleteSelectedMember(); }
        else if (e.ctrlKey && e.key === 'z') { e.preventDefault(); const undoBtn = document.getElementById('undoDeleteBtn'); if (undoBtn) undoBtn.click(); }
      });

      function init() {
        loadData();
        const root = getCurrentRoot();
        if (root) expandedNodeIds.add(root.id);
        renderTree();
        updateStatusBar();
        updateFamilySelector();
        // 启动时自动从云端拉取数据，无弹窗
        autoSyncOnStartup();

          const dd = item.querySelector('.dropdown-menu');
          if (dd) {
            item.addEventListener('click', function(e) { e.stopPropagation(); const wasOpen = dd.classList.contains('show'); document.querySelectorAll('.dropdown-menu.show').forEach(m => m.classList.remove('show')); if (!wasOpen) dd.classList.add('show'); });
            dd.addEventListener('click', function(e) { e.stopPropagation(); dd.classList.remove('show'); });

        });
        document.addEventListener('click', function() { document.querySelectorAll('.dropdown-menu.show').forEach(m => m.classList.remove('show')); });
