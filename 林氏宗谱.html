<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>族谱管理系统</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
  </script>
  <style>
    :root {
      --bg-menu: #f2f2f2;
      --bg-status: #f0f0f0;
      --bg-main: #ffffff;
      --bg-tree: #ffffff;
      --border-color: #c8c8c8;
      --highlight-bg: #0078d4;
      --highlight-text: #ffffff;
      --hover-bg: #e8f0fe;
      --danger-bg: #c42b1c;
      --font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      --font-mono: 'Cascadia Code', 'Consolas', monospace;
      --color-self: #0078d4;
      --color-other: #27ae60;
      --color-spouse: #e67e22;
      --org-line-color: #b0b8c8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      font-size: 13px;
      background: #e8e8e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      padding: 10px;
      overflow-y: auto;
      overflow-x: auto;
    }

    .app-window {
      width: 100%;
      max-width: none;
      min-height: 92vh;
      background: var(--bg-main);
      border: 1px solid #999;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      position: relative;
    }

    .title-bar {
      background: linear-gradient(180deg, #fafafa 0%, #e8e8e8 100%);
      border-bottom: 1px solid #c0c0c0;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: #333;
      flex-shrink: 0;
    }

    .app-icon {
      width: 20px;
      height: 20px;
      background: #0078d4;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
    }

    .app-title {
      flex: 1;
    }

    .menu-bar {
      background: var(--bg-menu);
      border-bottom: 1px solid #d0d0d0;
      padding: 3px 6px;
      display: flex;
      gap: 2px;
      flex-shrink: 0;
      flex-wrap: wrap;
      align-items: center;
    }

    .menu-item {
      padding: 5px 13px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12.5px;
      color: #333;
      position: relative;
    }

    .menu-item:hover {
      background: #dce4f0;
    }

    .separator {
      width: 1px;
      background: #c8c8c8;
      margin: 3px 6px;
      align-self: stretch;
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      background: #fafafa;
      border: 1px solid #b0b0b0;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      z-index: 1000;
      min-width: 200px;
      padding: 4px 0;
      display: none;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dm-item {
      padding: 7px 20px;
      cursor: pointer;
      font-size: 12.5px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dm-item:hover {
      background: #e0e8f4;
    }

    .dm-item.danger {
      color: #c42b1c;
    }

    .toolbar {
      background: #f7f7f7;
      border-bottom: 1px solid #d8d8d8;
      padding: 5px 10px;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar button {
      padding: 6px 14px;
      border: 1px solid #c0c0c0;
      border-radius: 5px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 12px;
    }

    .toolbar button:hover {
      background: #e8ecf2;
    }

    .toolbar button.primary {
      background: #0078d4;
      color: #fff;
      border-color: #0066b8;
    }

    .toolbar button.danger {
      background: #fff;
      color: #c42b1c;
      border-color: #d08078;
    }

    .tb-separator {
      width: 1px;
      background: #d0d0d0;
      margin: 2px 4px;
      align-self: stretch;
    }

    .main-body {
      display: flex;
      flex: 1;
      overflow: auto;
      position: relative;
      min-height: 0;
    }

    .sash {
      width: 5px;
      background: #e0e0e0;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .sash:hover,
    .sash.active {
      background: #0078d4;
    }

    .tree-panel {
      background: var(--bg-tree);
      overflow: auto;
      flex-shrink: 0;
      min-width: 180px;
      padding: 6px 0;
    }

    .tree-node {
      cursor: pointer;
      white-space: nowrap;
      padding: 4px 8px 4px 4px;
      margin: 1px 2px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
    }

    .tree-node:hover {
      background: var(--hover-bg);
    }

    .tree-node.selected {
      background: var(--highlight-bg);
      color: var(--highlight-text);
    }

    .tree-arrow {
      width: 16px;
      height: 16px;
      font-size: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #555;
    }

    .tree-arrow.expanded {
      transform: rotate(90deg);
    }

    .tree-arrow.no-children {
      visibility: hidden;
    }

    .tree-icon {
      width: 18px;
      height: 18px;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tree-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fafafa;
      min-width: 300px;
    }

    .detail-header {
      background: #f5f5f5;
      border-bottom: 1px solid #d8d8d8;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .key-icon {
      font-size: 16px;
    }

    .key-path {
      color: #888;
      font-size: 11.5px;
      font-family: var(--font-mono);
      flex: 1;
    }

    .tab-bar {
      display: flex;
      background: #f5f5f5;
      border-bottom: 1px solid #d8d8d8;
      padding: 0 10px;
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 9px 18px;
      cursor: pointer;
      border: none;
      background: transparent;
      font-size: 12.5px;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: all 0.15s;
      margin-bottom: -1px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: #333;
      background: #eef2f7;
    }

    .tab-btn.active {
      color: #0078d4;
      border-bottom-color: #0078d4;
      font-weight: 600;
      background: #fafafa;
    }

    .tab-content {
      flex: 1;
      overflow: auto;
      display: none;
      padding: 4px;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
    }

    .attr-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .attr-table th {
      background: #f0f0f0;
      border: 1px solid #d0d0d0;
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      position: sticky;
      top: 0;
    }

    .attr-table td {
      border: 1px solid #e0e0e0;
      padding: 7px 12px;
      color: #333;
    }

    .col-name {
      font-family: var(--font-mono);
      font-weight: 500;
      width: 35%;
    }

    .col-data {
      width: 65%;
      cursor: pointer;
    }

    .col-data input,
    .col-data textarea,
    .col-data select {
      width: 100%;
      padding: 6px 8px;
      border: 2px solid #0078d4;
      border-radius: 4px;
      font-size: 12.5px;
      font-family: var(--font-family);
    }

    .col-data textarea {
      resize: vertical;
      min-height: 60px;
    }

    .child-link {
      color: #0078d4;
      cursor: pointer;
      text-decoration: underline;
      margin-right: 4px;
    }

    .child-link:hover {
      color: #005a9e;
    }

    .sort-btn {
      margin-left: 8px;
      cursor: pointer;
      color: #0078d4;
      font-size: 12px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #aaa;
      gap: 8px;
    }

    .org-chart {
      flex: 1;
      overflow: auto;
      padding: 20px 30px;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      background: #ffffff;
      border-radius: 6px;
    }

    .org-tree {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      min-width: max-content;
      transform-origin: top left;
      transition: transform 0.2s ease;
      background: #ffffff;
    }

    .org-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      min-width: 100px;
      text-align: center;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      background: #fff;
      position: relative;
      z-index: 2;
      margin: 4px 8px;
      white-space: nowrap;
    }

    .org-node:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .org-node.node-self {
      border-color: var(--color-self);
      background: #e8f4fd;
    }

    .org-node.node-other {
      border-color: var(--color-other);
      background: #f4fdf7;
    }

    .org-node.node-spouse {
      border-color: var(--color-spouse);
      background: #fef5e7;
    }

    .org-node .node-name {
      font-weight: 600;
      font-size: 13px;
    }

    .org-node .node-years {
      font-size: 9px;
      color: #aaa;
    }

    .org-children {
      display: flex;
      justify-content: center;
      position: relative;
      padding-top: 30px;
    }

    .org-node.has-children::after {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 50%;
      width: 2px;
      height: 18px;
      background: var(--org-line-color);
      z-index: 1;
    }

    .org-children.multiple::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--org-line-color);
      z-index: 1;
    }

    .org-branch {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .org-branch::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 50%;
      width: 2px;
      height: 20px;
      background: var(--org-line-color);
      z-index: 1;
    }

    .spouse-pair {
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .spouse-pair::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--color-spouse);
      z-index: 1;
    }

    .sibling-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 0;
      flex-direction: row-reverse;
    }

    .view-mode-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 8px 12px;
      background: #f0f3f7;
      border-bottom: 1px solid #d8d8d8;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .view-mode-bar button {
      padding: 4px 12px;
      border: 1px solid #b0b0b0;
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.12s;
      white-space: nowrap;
    }

    .view-mode-bar button.active {
      background: #0078d4;
      color: #fff;
      border-color: #0066b8;
      font-weight: 500;
    }

    .graph-legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px 14px;
      border-top: 1px solid #e8e8e8;
      background: #fafafa;
      font-size: 11px;
      color: #666;
      flex-shrink: 0;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 4px;
      vertical-align: middle;
    }

    .status-bar {
      background: #f0f0f0;
      border-top: 1px solid #d0d0d0;
      padding: 5px 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11.5px;
      color: #666;
      flex-shrink: 0;
    }

    .status-path {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-count {
      flex-shrink: 0;
    }

    .context-menu {
      position: fixed;
      background: #fafafa;
      border: 1px solid #b0b0b0;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      z-index: 2000;
      min-width: 200px;
      padding: 4px 0;
      display: none;
    }

    .context-menu.show {
      display: block;
    }

    .cm-item {
      padding: 8px 18px;
      cursor: pointer;
      font-size: 12.5px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .cm-item:hover {
      background: #e0e8f4;
    }

    .cm-item.danger {
      color: #c42b1c;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-dialog {
      background: #fafafa;
      border: 1px solid #999;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      width: 500px;
      max-width: 95vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      background: #f0f0f0;
      border-bottom: 1px solid #d0d0d0;
      padding: 12px 18px;
      font-weight: 600;
    }

    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      background: #f5f5f5;
      border-top: 1px solid #d8d8d8;
      padding: 12px 18px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-primary {
      background: #0078d4;
      color: #fff;
      border-color: #0066b8;
    }

    .btn-cancel {
      background: #e8e8e8;
      color: #333;
    }

    .undo-bar,
    .info-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: #fff3cd;
      border-bottom: 1px solid #ffc107;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #856404;
      z-index: 10;
    }

    .undo-bar button,
    .info-bar button {
      background: #0078d4;
      color: #fff;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-left: auto;
    }

    body.mobile-layout .main-body {
      flex-direction: column;
    }

    body.mobile-layout .tree-panel {
      max-height: 35vh;
    }

    body.mobile-layout .sash {
      display: none;
    }

    .sort-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
    }

    .sort-item span {
      flex: 1;
    }

    .sort-item button {
      padding: 2px 8px;
      margin-left: 4px;
    }

    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      font-size: 12px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="app-window" id="appWindow">
    <div class="title-bar">
      <div class="app-icon">林</div>
      <span class="app-title">族谱管理系统</span>
    </div>
    <div class="menu-bar">
      <div class="menu-item" data-menu="file" id="menuFile">文件
        <div class="dropdown-menu" id="dropdownFile">
          <div class="dm-item" onclick="exportData()">📤 导出</div>
          <div class="dm-item" onclick="importData()">📥 导入</div>
          <div class="dm-item danger" onclick="resetAllData()">🗑️ 重置</div>
        </div>
      </div>
      <div class="menu-item" data-menu="edit" id="menuEdit">编辑
        <div class="dropdown-menu" id="dropdownEdit">
          <div class="dm-item" onclick="addChildMember()">➕ 添加子成员</div>
          <div class="dm-item" onclick="addSiblingMember()">👥 添加兄弟</div>
          <div class="dm-item" onclick="addAttribute()">📝 添加信息</div>
          <div class="dm-item danger" onclick="deleteSelectedMember()">🗑️ 删除成员</div>
        </div>
      </div>
      <div class="menu-item" id="menuSearch" onclick="openSearchDialog()">🔍 搜索</div>
      <span class="separator"></span>
      <div class="menu-item" onclick="showHelp()">帮助</div>
    </div>
    <div class="toolbar">
      <button class="primary" onclick="addChildMember()">➕ 添加子成员</button>
      <button onclick="addSiblingMember()">👥 添加兄弟</button>
      <span class="tb-separator"></span>
      <button onclick="addAttribute()">📝 添加信息</button>
      <button onclick="deleteAttribute()">🗑️ 删除信息</button>
      <span class="tb-separator"></span>
      <button class="danger" onclick="deleteSelectedMember()">⚠️ 删除成员</button>
      <button onclick="openSortDialog()" title="手动调整子女顺序">↕️ 子女排序</button>
      <span class="tb-separator"></span>
      <button onclick="expandAllNodes()">📂 全部展开</button>
      <button onclick="collapseAllNodes()">📁 全部折叠</button>
    </div>
    <div class="main-body" id="mainBody">
      <div class="tree-panel" id="treePanel">
        <div id="treeRoot"></div>
      </div>
      <div class="sash" id="sash"></div>
      <div class="detail-panel" id="detailPanel">
        <div class="detail-header">
          <span class="key-icon">📄</span>
          <span id="detailTitle">请选择一个成员</span>
          <span class="key-path" id="detailPath"></span>
        </div>
        <div class="tab-bar">
          <button class="tab-btn active" data-tab="properties" onclick="switchTab('properties')">📋 个人信息</button>
          <button class="tab-btn" data-tab="relation" onclick="switchTab('relation')">🔗 辈分关系图</button>
        </div>
        <div class="tab-content active" id="tab-properties">
          <div class="empty-state" id="emptyState"><span class="empty-icon">👈</span><span>在左侧选择成员</span></div>
          <table class="attr-table" id="attrTable" style="display:none;">
            <thead><tr><th>名称</th><th>数据</th></tr></thead>
            <tbody id="attrTableBody"></tbody>
          </table>
        </div>
        <div class="tab-content" id="tab-relation">
          <div class="view-mode-bar" id="viewModeBar">
            <div>
              <span>查看范围：</span>
              <button data-mode="full" class="active" onclick="setViewMode('full')">全图</button>
              <button data-mode="two" onclick="setViewMode('two')">上下各2代</button>
              <button data-mode="siblings" onclick="setViewMode('siblings')">同辈</button>
              <button data-mode="custom" onclick="setViewMode('custom')">自定义</button>
            </div>
            <div>
              <span>缩放：</span><button onclick="zoomIn()">➕</button><button onclick="zoomOut()">➖</button>
              <button onclick="zoomToFit()" id="btnFitScreen">适应屏幕</button>
              <button onclick="zoomReset()" id="btnOriginalSize">原始尺寸</button>
              <button onclick="exportChartImage()" title="导出完整辈分关系图">📷 导出图片</button>
            </div>
          </div>
          <div class="org-chart" id="orgChartContainer">
            <div class="empty-state" id="relationEmpty"><span>请选择一个成员</span></div>
            <div class="org-tree" id="orgTree" style="display:none;"></div>
          </div>
          <div class="graph-legend">
            <span><span class="legend-dot" style="background:#e8f4fd;border:1px solid #0078d4;"></span> 当前成员</span>
            <span><span class="legend-dot" style="background:#f4fdf7;border:1px solid #27ae60;"></span> 其他成员</span>
            <span><span class="legend-dot" style="background:#fef5e7;border:1px solid #e67e22;"></span> 配偶</span>
          </div>
        </div>
      </div>
    </div>
    <div class="status-bar">
      <span>📍 代际：</span><span class="status-path" id="statusPath">族谱管理系统</span>
      <span class="status-count" id="statusCount">共 0 位成员</span>
    </div>
  </div>
  <div class="context-menu" id="contextMenu">
    <div class="cm-item" onclick="addChildMember()">➕ 添加子成员</div>
    <div class="cm-item" onclick="addSiblingMember()">👥 添加兄弟</div>
    <div class="cm-item" onclick="addAttribute()">📝 添加信息</div>
    <div class="cm-item danger" onclick="deleteSelectedMember()">🗑️ 删除</div>
  </div>
  <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="handleFileImport(event)">
  <script>
    (function() {
      const STORAGE_KEY = 'jiumu_family_v16';
      let familyData = null;
      let selectedNodeId = null;
      let expandedNodeIds = new Set();
      let currentTab = 'properties';
      let relationViewMode = 'full';
      let currentScale = 1;
      let customUp = 2,
        customDown = 2;
      let pendingDelete = null;
      let autoFitEnabled = false;

      if (/Mobi|Android/i.test(navigator.userAgent)) document.body.classList.add('mobile-layout');

      function generateId() {
        return 'n' + Date.now() + Math.random().toString(36).substr(2, 8);
      }

      function createTestData() {
        const root = {
          id: 'root',
          name: '族谱管理系统',
          isRoot: true,
          children: []
        };
        const ancestor = {
          id: generateId(),
          name: '林始祖',
          attributes: [{ name: '性别', value: '男' }, { name: '出生日期', value: '1520-03-15' }, { name: '配偶',
            value: '陈氏' }, { name: '出生地', value: '福建莆田' }],
          children: []
        };
        root.children.push(ancestor);
        let total = 1;
        const chars = ['建', '文', '明', '龙', '伟', '强', '志', '宇', '浩', '博', '健', '泽', '瑞', '荣', '华', '国', '家', '兴',
          '盛', '德', '仁', '义', '礼', '智', '信', '孝', '忠', '勇', '贤', '良'
        ];
        const places = ['福建莆田', '福建厦门', '福建福州', '福建泉州', '福建漳州'];

        function rInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

        function gen(node, depth) {
          if (depth >= 7 || total >= 300) return;
          let maxSons = depth < 2 ? Math.min(8, 300 - total) : (depth < 4 ? Math.min(6, 300 - total) : Math.min(4,
            300 - total));
          for (let i = 0; i < rInt(1, Math.max(1, maxSons)); i++) {
            if (total >= 300) break;
            const given = chars[rInt(0, chars.length - 1)] + (Math.random() > 0.6 ? chars[rInt(0, chars.length - 1)] :
              '');
            const birthYear = 1520 + depth * 28 + rInt(0, 25);
            const birthDate = birthYear + '-' + (rInt(1, 12) + '').padStart(2, '0') + '-' + (rInt(1, 28) + '').padStart(2,
              '0');
            const spouse = Math.random() > 0.4 ? ['陈', '王', '李', '张', '黄', '吴', '郑'][rInt(0, 6)] + '氏' : '';
            const son = {
              id: generateId(),
              name: '林' + given,
              attributes: [{ name: '性别', value: '男' }, { name: '出生日期', value: birthDate }, { name: '配偶',
                value: spouse }, { name: '出生地', value: places[rInt(0, places.length - 1)] }],
              children: []
            };
            node.children.push(son);
            total++;
            gen(son, depth + 1);
          }
        }
        gen(ancestor, 1);
        return root;
      }

      function loadData() {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) {
          try { familyData = JSON.parse(s); if (!familyData.isRoot) throw new Error(); } catch (e) { familyData =
              createTestData(); }
        } else { familyData = createTestData(); }
        saveData();
      }

      function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(familyData));
        updateStatusBar(); }

      function findNodeById(node, id) {
        if (node.id === id) return node;
        if (node.children) for (const c of node.children) { const f = findNodeById(c, id); if (f) return f; }
        return null;
      }

      function findParentNode(root, targetId) {
        if (!root.children) return null;
        for (const c of root.children) { if (c.id === targetId) return root; const f = findParentNode(c, targetId); if (f)
            return f; }
        return null;
      }

      function countMembers(node) { let c = node.isRoot ? 0 : 1; if (node.children) for (const ch of node.children) c +=
          countMembers(ch); return c; }

      function getAttr(node, name) { if (!node || !node.attributes) return ''; const a = node.attributes.find(a => a.name ===
          name); return a ? a.value : ''; }

      function setAttr(node, name, value) { if (!node.attributes) node.attributes = []; const a = node.attributes.find(a => a
          .name === name); if (a) a.value = value;
        else node.attributes.push({ name, value }); }

      function isMale(node) { return getAttr(node, '性别') !== '女'; }

      function escapeHtml(s) { const d = document.createElement('div');
        d.textContent = s || ''; return d.innerHTML; }

      function sortByBirthDateDesc(nodes) {
        return nodes.sort((a, b) => { const dateA = getAttr(a, '出生日期') || '0000-00-00'; const dateB = getAttr(b,
            '出生日期') || '0000-00-00'; return dateA.localeCompare(dateB); });
      }

      function isDateValid(dateStr) {
        if (!dateStr) return true;
        const parts = dateStr.split('-');
        if (parts.length !== 3) return false;
        const year = parseInt(parts[0]);
        const month = parseInt(parts[1]);
        const day = parseInt(parts[2]);
        if (isNaN(year) || isNaN(month) || isNaN(day)) return false;
        if (month < 1 || month > 12 || day < 1 || day > 31) return false;
        const inputDate = new Date(year, month - 1, day);
        if (inputDate.getFullYear() !== year || inputDate.getMonth() !== month - 1 || inputDate.getDate() !== day) return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        return inputDate <= today;
      }

      function getNodePath(node) {
        const path = [];
        let current = node;
        while (current) {
          if (!current.isRoot) {
            path.unshift(current.name);
          }
          current = findParentNode(familyData, current.id);
        }
        return path;
      }

      function renderTree() {
        const treeRoot = document.getElementById('treeRoot');
        treeRoot.innerHTML = '';

        function renderNode(node, depth, cont) {
          const div = document.createElement('div');
          div.className = 'tree-node';
          div.style.paddingLeft = (depth * 20 + 4) + 'px';
          div.dataset.nodeId = node.id;
          if (node.id === selectedNodeId) div.classList.add('selected');
          const hasChildren = node.children && node.children.length > 0;
          const arrow = document.createElement('span');
          arrow.className = 'tree-arrow';
          arrow.textContent = '▶';
          if (!hasChildren) arrow.classList.add('no-children');
          else if (expandedNodeIds.has(node.id)) arrow.classList.add('expanded');
          arrow.onclick = e => { e.stopPropagation(); if (hasChildren) toggleExpand(node.id); };
          div.appendChild(arrow);
          const icon = document.createElement('span');
          icon.className = 'tree-icon';
          icon.textContent = node.isRoot ? '🏠' : (hasChildren ? '📁' : '👤');
          div.appendChild(icon);
          div.appendChild(document.createTextNode(node.name));
          div.onclick = e => { selectNode(node.id); };
          div.oncontextmenu = e => { e.preventDefault();
            showContextMenu(e.clientX, e.clientY, node); };
          cont.appendChild(div);
          if (hasChildren && expandedNodeIds.has(node.id)) {
            const cc = document.createElement('div');
            cc.className = 'tree-children';
            const sortedChildren = sortByBirthDateDesc([...node.children]);
            for (const c of sortedChildren) renderNode(c, depth + 1, cc);
            cont.appendChild(cc);
          }
          // 滚动到选中节点
          if (node.id === selectedNodeId) {
            setTimeout(() => {
              div.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
          }
        }
        renderNode(familyData, 0, treeRoot);
        if (!expandedNodeIds.has(familyData.id)) { expandedNodeIds.add(familyData.id);
          renderTree(); return; }
        updateStatusBar();
      }

      function toggleExpand(id) { if (expandedNodeIds.has(id)) expandedNodeIds.delete(id);
        else expandedNodeIds.add(id);
        renderTree(); if (selectedNodeId) refreshDetailView(); }

      function selectNode(id) { selectedNodeId = id;
        refreshDetailView();
        renderTree();
        updateStatusBar(); }

      function refreshDetailView() { const n = selectedNodeId ? findNodeById(familyData, selectedNodeId) : null; if (
          currentTab === 'properties') renderDetailPanel(n);
        else renderOrgChart(n); }

      function renderDetailPanel(node) {
        document.getElementById('detailTitle').textContent = node ? '👤 ' + node.name : '请选择一个成员';
        if (node && !node.isRoot) {
          const path = getNodePath(node);
          document.getElementById('detailPath').textContent = '代际: ' + path.join(' > ');
        } else {
          document.getElementById('detailPath').textContent = '';
        }
        const empty = document.getElementById('emptyState'),
          table = document.getElementById('attrTable'),
          tbody = document.getElementById('attrTableBody');
        if (!node || node.isRoot) { empty.style.display = 'flex';
          table.style.display = 'none'; return; }
        empty.style.display = 'none';
        table.style.display = 'table';
        tbody.innerHTML = '';
        const sons = node.children ? node.children.filter(c => getAttr(c, '性别') === '男') : [];
        const daughters = node.children ? node.children.filter(c => getAttr(c, '性别') === '女') : [];
        const sonsHtml = sons.length ? sons.map(c =>
          `<span class="child-link" data-child-id="${c.id}">${escapeHtml(c.name)}</span>`).join('、') : '（无）';
        const daughtersHtml = daughters.length ? daughters.map(c =>
          `<span class="child-link" data-child-id="${c.id}">${escapeHtml(c.name)}</span>`).join('、') : '（无）';
        const fixedFields = [
          { name: '姓名', value: node.name, attr: null, type: 'text' },
          { name: '性别', value: getAttr(node, '性别'), attr: '性别', type: 'select' },
          { name: '出生日期', value: getAttr(node, '出生日期'), attr: '出生日期', type: 'date' },
          { name: '出生地', value: getAttr(node, '出生地'), attr: '出生地', type: 'text' },
          { name: '配偶', value: getAttr(node, '配偶'), attr: '配偶', type: 'text' },
          { name: '子', value: sonsHtml, attr: null, editable: false, isHtml: true },
          { name: '女', value: daughtersHtml, attr: null, editable: false, isHtml: true }
        ];
        const customFields = [];
        if (node.attributes) {
          node.attributes.forEach((attr, idx) => {
            if (fixedFields.some(f => f.attr === attr.name || f.name === attr.name)) return;
            if (attr.name === '职业' || attr.name === '简介' || attr.name === '备注') return;
            customFields.push({ name: attr.name, value: attr.value, idx });
          });
        }
        const trailingFields = [
          { name: '职业', value: getAttr(node, '职业'), attr: '职业', type: 'text' },
          { name: '简介', value: getAttr(node, '简介'), attr: '简介', type: 'textarea' },
          { name: '备注', value: getAttr(node, '备注'), attr: '备注', type: 'textarea' }
        ];
        const allRows = [...fixedFields, ...customFields.map(c => ({ name: c.name, value: c.value, attr: c.name,
          customIdx: c.idx, type: 'text' })), ...trailingFields];
        allRows.forEach(f => {
          const tr = document.createElement('tr');
          const tdName = document.createElement('td');
          tdName.className = 'col-name';
          tdName.textContent = f.name;
          const tdData = document.createElement('td');
          tdData.className = 'col-data';
          tdData.setAttribute('data-field', f.name);
          if (f.isHtml) {
            tdData.innerHTML = f.value;
          } else {
            tdData.innerHTML = `<span class="data-text">${escapeHtml(f.value || '（空）')}</span>`;
          }
          tr.appendChild(tdName);
          tr.appendChild(tdData);
          if (f.editable !== false) {
            tdData.addEventListener('dblclick', () => {
              if (f.isHtml) return;
              if (f.customIdx !== undefined) startEditingCustom(tr, f.customIdx, node);
              else startEditing(tr, f.name, node, f.attr, f.type);
            });
          }
          tbody.appendChild(tr);
        });
        tbody.querySelectorAll('.child-link').forEach(link => {
          link.addEventListener('click', (e) => {
            e.stopPropagation();
            const childId = link.dataset.childId;
            if (childId) {
              const childNode = findNodeById(familyData, childId);
              if (childNode) {
                let p = childNode;
                while (p) { const par = findParentNode(familyData, p.id); if (par) expandedNodeIds.add(par.id);
                  p = par; }
                expandedNodeIds.add(childId);
                selectNode(childId);
                switchTab('properties');
              }
            }
          });
        });
      }

      function startEditing(tr, fieldName, node, attrName, fieldType) {
        const td = tr.querySelector('.col-data');
        if (td.querySelector('input, textarea, select')) return;
        const currentVal = fieldName === '姓名' ? node.name : (attrName ? getAttr(node, attrName) : '');
        let input;
        if (fieldType === 'select') {
          input = document.createElement('select');
          input.innerHTML = '<option value="男">男</option><option value="女">女</option>';
          input.value = (currentVal === '男' || currentVal === '女') ? currentVal : '男';
        } else if (fieldType === 'date') {
          input = document.createElement('input');
          input.type = 'date';
          input.value = currentVal || '';
        } else if (fieldType === 'textarea') {
          input = document.createElement('textarea');
          input.value = currentVal || '';
          input.style.height = 'auto';
          input.style.minHeight = '60px';
        } else {
          input = document.createElement('input');
          input.type = 'text';
          input.value = currentVal || '';
        }
        input.style.width = '100%';
        td.innerHTML = '';
        td.appendChild(input);
        input.focus();
        const save = () => {
          let newVal = input.value.trim();
          if (fieldType === 'select') {
            if (newVal !== '男' && newVal !== '女') {
              alert('性别只能是"男"或"女"');
              input.focus();
              return;
            }
          }
          if (fieldType === 'date') {
            if (newVal && !isDateValid(newVal)) {
              alert('出生日期不能晚于今天，且格式需为YYYY-MM-DD');
              input.focus();
              return;
            }
          }
          if (fieldName === '姓名') { if (newVal && newVal !== node.name) { node.name = newVal;
              saveData();
              renderTree();
              selectNode(node.id); } } else if (attrName) { setAttr(node, attrName, newVal);
            saveData();
            renderDetailPanel(node); }
        };
        input.addEventListener('blur', save);
        input.addEventListener('keydown', e => { if (e.key === 'Enter' && fieldType !== 'textarea') { e.preventDefault();
            save(); } });
      }

      function startEditingCustom(tr, idx, node) {
        const td = tr.querySelector('.col-data');
        if (td.querySelector('input')) return;
        const currentVal = node.attributes[idx] ? node.attributes[idx].value : '';
        const input = document.createElement('input');
        input.value = currentVal;
        td.innerHTML = '';
        td.appendChild(input);
        input.focus();
        const save = () => { if (node.attributes[idx]) { node.attributes[idx].value = input.value.trim();
            saveData();
            renderDetailPanel(node); } };
        input.addEventListener('blur', save);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
            save(); } });
      }

      function addAttribute() {
        const node = selectedNodeId ? findNodeById(familyData, selectedNodeId) : null;
        if (!node || node.isRoot) { alert('请选择一个成员'); return; }
        const name = prompt('新信息名称：');
        if (name && name.trim()) {
          const trimmedName = name.trim();
          if (trimmedName === '职业' || trimmedName === '简介' || trimmedName === '备注') {
            alert('该信息已存在固定位置，请使用其他名称');
            return;
          }
          if (!node.attributes) node.attributes = [];
          const exists = node.attributes.some(a => a.name === trimmedName);
          if (exists) {
            alert('该信息已存在');
            return;
          }
          node.attributes.push({ name: trimmedName, value: '' });
          saveData();
          renderDetailPanel(node);
        }
      }

      function deleteAttribute() {
        const node = selectedNodeId ? findNodeById(familyData, selectedNodeId) : null;
        if (!node || node.isRoot) return;
        const name = prompt('要删除的信息名称：');
        if (name && node.attributes) { const idx = node.attributes.findIndex(a => a.name === name); if (idx >= 0) { node
            .attributes.splice(idx, 1);
            saveData();
            renderDetailPanel(node); } else alert('未找到该信息'); }
      }

      function openSortDialog() {
        const node = selectedNodeId ? findNodeById(familyData, selectedNodeId) : null;
        if (!node || node.isRoot || !node.children || node.children.length < 2) { alert('当前成员无子女或子女不足两个，无需排序'); return; }
        const children = [...node.children];
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `<div class="modal-dialog" style="width:400px;"><div class="modal-header">排序子女 (共${children.length}位)</div>
        <div class="modal-body" id="sortList">${children.map((c, i) => `
        <div class="sort-item" data-index="${i}">
          <span>${escapeHtml(c.name)} (${getAttr(c,'性别')})</span>
          <div>
            <button class="btn-up" ${i===0?'disabled':''}>▲</button>
            <button class="btn-down" ${i===children.length-1?'disabled':''}>▼</button>
          </div>
        </div>`).join('')}</div>
        <div class="modal-footer"><button class="btn-cancel" id="sortCancel">取消</button><button class="btn-primary" id="sortOk">保存排序</button></div></div>`;
        document.body.appendChild(overlay);
        const sortList = overlay.querySelector('#sortList');

        function updateButtons() { const items = sortList.querySelectorAll('.sort-item');
          items.forEach((item, idx) => { const up = item.querySelector('.btn-up'); const down = item.querySelector(
              '.btn-down');
            up.disabled = (idx === 0);
            down.disabled = (idx === items.length - 1); }); }
        sortList.addEventListener('click', e => { const btn = e.target; const item = btn.closest('.sort-item'); if (!item)
            return; const index = Array.from(sortList.children).indexOf(item); if (btn.classList.contains('btn-up') &&
            index > 0) { sortList.insertBefore(item, sortList.children[index - 1]);
            updateButtons(); } else if (btn.classList.contains('btn-down') && index < sortList.children.length - 1) {
            sortList.insertBefore(sortList.children[index + 1], item);
            updateButtons(); } });
        overlay.querySelector('#sortCancel').onclick = () => overlay.remove();
        overlay.querySelector('#sortOk').onclick = () => { const newOrder = Array.from(sortList.querySelectorAll(
            '.sort-item')).map(item => { const idx = parseInt(item.dataset.index); return children[idx]; });
          node.children = newOrder;
          saveData();
          renderTree();
          refreshDetailView();
          overlay.remove();
          showInfoBar('子女顺序已更新'); };
      }

      function updateViewModeButtons(mode) { document.querySelectorAll('#viewModeBar button[data-mode]').forEach(b => b
          .classList.remove('active')); const activeBtn = document.querySelector(`#viewModeBar button[data-mode="${mode}"]`);
        if (activeBtn) activeBtn.classList.add('active'); }

      function updateZoomButtons() { const btnFit = document.getElementById('btnFitScreen'); const btnOrig = document
          .getElementById('btnOriginalSize'); if (btnFit) btnFit.classList.toggle('active', autoFitEnabled); if (btnOrig)
          btnOrig.classList.toggle('active', !autoFitEnabled && currentScale === 1); }

      function setViewMode(mode) {
        if (mode === 'custom') {
          showCustomRangeDialog((up, down) => { customUp = up;
            customDown = down;
            relationViewMode = 'custom';
            updateViewModeButtons('custom');
            switchToRelation(); });
          return;
        }
        relationViewMode = mode;
        updateViewModeButtons(mode);
        switchToRelation();
      }

      function switchToRelation() {
        if (currentTab !== 'relation') {
          currentTab = 'relation';
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          document.querySelector('[data-tab="relation"]').classList.add('active');
          document.getElementById('tab-relation').classList.add('active');
        }
        refreshDetailView();
      }

      function showCustomRangeDialog(callback) {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `<div class="modal-dialog" style="width:360px;"><div class="modal-header">⚙️ 自定义代数范围</div>
        <div class="modal-body">
          <div class="form-group"><label>向上代数 (0-9，0表示查询人自己)</label><input type="number" id="customUpInput" value="${customUp}" min="0" max="9" style="width:100%;padding:8px;"></div>
          <div class="form-group"><label>向下代数 (0-9，0表示查询人自己)</label><input type="number" id="customDownInput" value="${customDown}" min="0" max="9" style="width:100%;padding:8px;"></div>
        </div>
        <div class="modal-footer"><button class="btn-cancel" id="customCancel">取消</button><button class="btn-primary" id="customOk">确定</button></div></div>`;
        document.body.appendChild(overlay);
        document.getElementById('customCancel').onclick = () => overlay.remove();
        document.getElementById('customOk').onclick = () => { let up = parseInt(document.getElementById('customUpInput')
            .value); let down = parseInt(document.getElementById('customDownInput').value);
          if (isNaN(up) || up < 0) up = 0;
          if (isNaN(down) || down < 0) down = 0;
          up = Math.min(9, Math.max(0, up));
          down = Math.min(9, Math.max(0, down));
          overlay.remove();
          callback(up, down); };
      }

      function renderOrgChart(node) {
        document.getElementById('detailTitle').textContent = node ? '🏢 ' + node.name : '请选择一个成员';
        if (node && !node.isRoot) {
          const path = getNodePath(node);
          document.getElementById('detailPath').textContent = '代际: ' + path.join(' > ');
        } else {
          document.getElementById('detailPath').textContent = '';
        }
        const orgTree = document.getElementById('orgTree'),
          empty = document.getElementById('relationEmpty');
        orgTree.innerHTML = '';
        orgTree.style.display = 'none';
        empty.style.display = 'flex';
        if (!node || node.isRoot) return;
        let maleNode = node;
        if (!isMale(maleNode)) { const p = findParentNode(familyData, maleNode.id); if (p && !p.isRoot && isMale(p))
            maleNode = p;
          else return; }
        let treeData = null;
        if (relationViewMode === 'siblings') { const parent = findParentNode(familyData, maleNode.id); const siblings =
            parent && !parent.isRoot ? parent.children.filter(c => isMale(c)) : [maleNode]; const sorted =
            sortByBirthDateDesc([...siblings]);
          treeData = { node: sorted.find(s => s.id === maleNode.id) || maleNode, siblings: sorted.filter(s => s.id !==
              maleNode.id) }; } else if (relationViewMode === 'two' || relationViewMode === 'custom') { const up =
            relationViewMode === 'two' ? 2 : customUp; const down = relationViewMode === 'two' ? 2 : customDown;
          let ancestors = [];
          let cur = maleNode;
          if (up > 0) {
            for (let i = 0; i < up; i++) { const p = findParentNode(familyData, cur.id); if (!p || p.isRoot) break; if (isMale(
                p)) { ancestors.unshift(p);
                cur = p; } else break; }
          }

          function buildDescendant(n, depth) { 
            const f = { node: n, children: [] }; 
            if (down === 0 && depth === 0) {
              return f;
            }
            if (depth < down && n.children) { const
                maleChildren = n.children.filter(c => isMale(c)); const sortedChildren = sortByBirthDateDesc(maleChildren);
                sortedChildren.forEach(c => f.children.push(buildDescendant(c, depth + 1))); } 
            return f; 
          }
          
          if (down === 0) {
            const rootDesc = { node: maleNode, children: [] };
            if (ancestors.length > 0) { let root = ancestors[0];
              let prev = null;
              ancestors.forEach(anc => { const obj = { node: anc, children: [] }; if (prev) prev.children.push(obj);
                else root = obj;
                prev = obj; });
              prev.children.push(rootDesc);
              treeData = root; } else treeData = rootDesc;
          } else {
            const rootDesc = buildDescendant(maleNode, 0);
            if (ancestors.length > 0) { let root = ancestors[0];
              let prev = null;
              ancestors.forEach(anc => { const obj = { node: anc, children: [] }; if (prev) prev.children.push(obj);
                else root = obj;
                prev = obj; });
              prev.children.push(rootDesc);
              treeData = root; } else treeData = rootDesc;
          }
        } else {
          function buildFull(n) { const f = { node: n, children: [] }; if (n.children) { const sorted =
              sortByBirthDateDesc(n.children.filter(c => isMale(c)));
              sorted.forEach(c => f.children.push(buildFull(c))); } return f; }
          let anc = maleNode;
          while (true) { const p = findParentNode(familyData, anc.id); if (p && !p.isRoot && isMale(p)) anc = p;
            else break; }
          treeData = buildFull(anc);
        }
        if (!treeData) return;
        empty.style.display = 'none';
        orgTree.style.display = 'inline-flex';
        orgTree.style.transform = `scale(${currentScale})`;

        function createCard(nObj, isSelf, isSpouse = false) {
          const card = document.createElement('div');
          card.className = 'org-node';
          if (isSpouse) card.classList.add('node-spouse');
          else if (isSelf) card.classList.add('node-self');
          else card.classList.add('node-other');
          card.innerHTML = `<span class="node-name">${escapeHtml(nObj.name)}</span><span class="node-years">${getAttr(nObj,'出生日期')||''}</span>`;
          card.onclick = () => { selectNode(nObj.id);
            switchTab('relation'); };
          return card;
        }

        function renderNode(tn, container, isSelf) {
          if (tn.siblings !== undefined) {
            const allNodes = [tn.node, ...tn.siblings];
            const row = document.createElement('div');
            row.className = 'sibling-row';
            allNodes.forEach(s => {
              const spouseName = getAttr(s, '配偶');
              if (spouseName) {
                const pair = document.createElement('div');
                pair.className = 'spouse-pair';
                pair.style.display = 'flex';
                pair.style.alignItems = 'center';
                pair.style.gap = '4px';
                pair.appendChild(createCard(s, s.id === maleNode.id, false));
                const spouseCard = document.createElement('div');
                spouseCard.className = 'org-node node-spouse';
                spouseCard.innerHTML = `<span class="node-name">${escapeHtml(spouseName)}</span><span class="node-years">配偶</span>`;
                spouseCard.onclick = () => { selectNode(s.id); switchTab('relation'); };
                pair.appendChild(spouseCard);
                row.appendChild(pair);
              } else {
                row.appendChild(createCard(s, s.id === maleNode.id, false));
              }
            });
            container.appendChild(row);
            return;
          }
          const branch = document.createElement('div');
          branch.className = 'org-branch';
          const spouseName = getAttr(tn.node, '配偶');
          if (spouseName) {
            const pair = document.createElement('div');
            pair.className = 'spouse-pair';
            pair.style.display = 'flex';
            pair.style.alignItems = 'center';
            pair.style.gap = '4px';
            pair.style.position = 'relative';
            pair.appendChild(createCard(tn.node, isSelf, false));
            const spouseCard = document.createElement('div');
            spouseCard.className = 'org-node node-spouse';
            spouseCard.innerHTML = `<span class="node-name">${escapeHtml(spouseName)}</span><span class="node-years">配偶</span>`;
            spouseCard.onclick = () => { selectNode(tn.node.id); switchTab('relation'); };
            pair.appendChild(spouseCard);
            branch.appendChild(pair);
            if (tn.children && tn.children.length) {
              pair.classList.add('has-children');
            }
          } else {
            const card = createCard(tn.node, isSelf, false);
            if (tn.children && tn.children.length) card.classList.add('has-children');
            branch.appendChild(card);
          }
          if (tn.children && tn.children.length) {
            const chDiv = document.createElement('div');
            chDiv.className = 'org-children' + (tn.children.length > 1 ? ' multiple' : '');
            tn.children.forEach(ch => renderNode(ch, chDiv, ch.node.id === maleNode.id));
            branch.appendChild(chDiv);
          }
          container.appendChild(branch);
        }
        orgTree.innerHTML = '';
        renderNode(treeData, orgTree, treeData.node.id === maleNode.id);
      }

      function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
        if (tab === 'relation') updateViewModeButtons(relationViewMode);
        refreshDetailView();
      }

      function applyScale() { document.getElementById('orgTree').style.transform = `scale(${currentScale})`; }

      function zoomIn() { autoFitEnabled = false;
        currentScale = Math.min(3, currentScale + 0.2);
        applyScale();
        updateZoomButtons(); }

      function zoomOut() { autoFitEnabled = false;
        currentScale = Math.max(0.2, currentScale - 0.2);
        applyScale();
        updateZoomButtons(); }

      function zoomReset() { autoFitEnabled = false;
        currentScale = 1;
        applyScale();
        updateZoomButtons(); }

      function zoomToFit() { const t = document.getElementById('orgTree'),
          c = document.getElementById('orgChartContainer'); if (!t || !c) return;
        currentScale = Math.min(1, (c.clientWidth - 40) / t.scrollWidth);
        autoFitEnabled = true;
        applyScale();
        updateZoomButtons(); }

      function exportChartImage() {
        const orgTree = document.getElementById('orgTree');
        const container = document.getElementById('orgChartContainer');
        if (!orgTree || !container) return;
        
        // 保存原始状态
        const prevTransform = orgTree.style.transform;
        const prevOverflow = container.style.overflow;
        const prevWidth = container.style.width;
        const prevHeight = container.style.height;
        
        // 计算完整尺寸
        const fullWidth = orgTree.scrollWidth + 60;
        const fullHeight = orgTree.scrollHeight + 60;
        
        // 临时修改为完整尺寸
        orgTree.style.transform = 'scale(1)';
        container.style.overflow = 'visible';
        container.style.width = fullWidth + 'px';
        container.style.height = fullHeight + 'px';
        
        // 移除所有节点的box-shadow以避免黑块
        const allNodes = container.querySelectorAll('.org-node');
        const originalBoxShadows = [];
        allNodes.forEach(node => {
          originalBoxShadows.push({
            node: node,
            boxShadow: node.style.boxShadow
          });
          node.style.boxShadow = 'none';
        });

        html2canvas(container, {
          backgroundColor: '#ffffff',
          scale: 2,
          allowTaint: false,
          useCORS: true,
          logging: false,
          width: fullWidth,
          height: fullHeight,
          windowWidth: fullWidth,
          windowHeight: fullHeight,
          onclone: function(clonedDoc) {
            const clonedContainer = clonedDoc.getElementById('orgChartContainer');
            if (clonedContainer) {
              clonedContainer.style.overflow = 'visible';
              clonedContainer.style.width = fullWidth + 'px';
              clonedContainer.style.height = fullHeight + 'px';
              clonedContainer.style.background = '#ffffff';
              
              const clonedTree = clonedDoc.getElementById('orgTree');
              if (clonedTree) {
                clonedTree.style.transform = 'scale(1)';
                clonedTree.style.background = '#ffffff';
              }
              
              const clonedNodes = clonedContainer.querySelectorAll('.org-node');
              clonedNodes.forEach(n => {
                n.style.boxShadow = 'none';
              });
            }
          }
        }).then(canvas => {
          // 恢复原始状态
          orgTree.style.transform = prevTransform;
          container.style.overflow = prevOverflow;
          container.style.width = prevWidth;
          container.style.height = prevHeight;
          
          // 恢复所有节点的box-shadow
          originalBoxShadows.forEach(item => {
            item.node.style.boxShadow = item.boxShadow;
          });
          
          const link = document.createElement('a');
          link.download = '辈分关系图.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(err => {
          // 恢复原始状态
          orgTree.style.transform = prevTransform;
          container.style.overflow = prevOverflow;
          container.style.width = prevWidth;
          container.style.height = prevHeight;
          
          // 恢复所有节点的box-shadow
          originalBoxShadows.forEach(item => {
            item.node.style.boxShadow = item.boxShadow;
          });
          
          alert('导出图片失败：' + err);
        });
      }

      function showUndoBar(deletedNode, parentNode) { const existing = document.querySelector('.undo-bar'); if (existing)
          existing.remove(); const bar = document.createElement('div');
        bar.className = 'undo-bar';
        bar.innerHTML = `已删除成员「${deletedNode.name}」<button id="undoDeleteBtn">撤销删除 (Ctrl+Z)</button>`;
        document.getElementById('appWindow').prepend(bar);
        document.getElementById('undoDeleteBtn').onclick = () => performUndo(bar); }

      function performUndo(bar) { if (!pendingDelete) return; const { node, parent } = pendingDelete; if (parent) { parent
          .children.push(node); } else { familyData.children.push(node); }
        pendingDelete = null; if (bar) bar.remove();
        saveData();
        renderTree();
        refreshDetailView();
        showInfoBar('已撤销删除'); }

      function showInfoBar(message, duration = 3000) { const existing = document.querySelector('.info-bar'); if (existing)
          existing.remove(); const bar = document.createElement('div');
        bar.className = 'info-bar';
        bar.innerHTML = `${message}<button onclick="this.parentElement.remove()">✕</button>`;
        document.getElementById('appWindow').prepend(bar); if (duration > 0) setTimeout(() => { if (bar.parentNode) bar
            .remove(); }, duration); }

      function deleteSelectedMember(id) { const nid = id || selectedNodeId; if (!nid) return; const node = findNodeById(
          familyData, nid); if (!node || node.isRoot) return; if (confirm(`确定删除「${node.name}」及其后代吗？`)) { const parent =
          findParentNode(familyData, nid); if (parent) { const idx = parent.children.findIndex(c => c.id === nid); if (idx >=
            0) { const deletedNode = parent.children.splice(idx, 1)[0];
            pendingDelete = { node: deletedNode, parent: parent }; if (selectedNodeId === nid) selectedNodeId = parent.id;
            saveData();
            renderTree();
            refreshDetailView();
            showUndoBar(deletedNode, parent); } } } }

      function openSearchDialog() {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
          <div class="modal-dialog" style="width:450px;">
            <div class="modal-header">🔍 多关键字搜索成员</div>
            <div class="modal-body">
              <div class="form-group"><label>搜索关键字（可输入姓名、性别、出生日期、职业、出生地等，用空格分隔）</label><input type="text" id="searchInput" placeholder="例如：林 男 福建" style="width:100%;padding:8px;"></div>
            </div>
            <div class="modal-footer"><button class="btn-cancel" id="searchCancel">取消</button><button class="btn-primary" id="searchOk">搜索</button></div>
          </div>`;
        document.body.appendChild(overlay);
        document.getElementById('searchCancel').onclick = () => overlay.remove();
        document.getElementById('searchOk').onclick = () => {
          const kw = document.getElementById('searchInput').value.trim();
          overlay.remove();
          if (kw) searchMember(kw);
        };
      }

      function searchMember(keyword) {
        const keywords = keyword.split(/\s+/).filter(k => k.length > 0);
        if (keywords.length === 0) {
          alert('请输入搜索关键字');
          return;
        }
        const results = [];

        function matchNode(node) {
          if (node.isRoot) return false;
          const searchText = [
            node.name || '',
            ...(node.attributes ? node.attributes.map(a => a.value || '') : [])
          ].join(' ').toLowerCase();
          return keywords.every(kw => searchText.includes(kw.toLowerCase()));
        }

        function s(n, path) {
          if (matchNode(n)) results.push({ node: n, path });
          if (n.children) n.children.forEach(c => s(c, [...path, n.name]));
        }
        s(familyData, []);
        if (!results.length) {
          alert('未找到匹配的成员');
          return;
        }
        if (results.length === 1) {
          const t = results[0].node;
          let p = t;
          while (p) { const par = findParentNode(familyData, p.id); if (par) expandedNodeIds.add(par.id);
            p = par; }
          expandedNodeIds.add(t.id);
          selectNode(t.id);
          switchTab('properties');
        } else {
          const overlay = document.createElement('div');
          overlay.className = 'modal-overlay';
          overlay.innerHTML = `
            <div class="modal-dialog">
              <div class="modal-header">找到 ${results.length} 位成员</div>
              <div class="modal-body">
                ${results.map(r => `<div style="padding:8px;cursor:pointer;border-bottom:1px solid #eee;" data-id="${r.node.id}">${escapeHtml(r.node.name)} <span style="color:#888;font-size:11px;">${r.path.join(' > ')}</span></div>`).join('')}
              </div>
              <div class="modal-footer"><button class="btn-cancel">取消</button></div>
            </div>`;
          document.body.appendChild(overlay);
          overlay.querySelector('.btn-cancel').onclick = () => overlay.remove();
          overlay.querySelectorAll('[data-id]').forEach(el => el.addEventListener('click', () => {
            const id = el.dataset.id;
            overlay.remove();
            const node = findNodeById(familyData, id);
            if (node) {
              let p = node;
              while (p) { const par = findParentNode(familyData, p.id); if (par) expandedNodeIds.add(par.id);
                p = par; }
              expandedNodeIds.add(node.id);
              selectNode(node.id);
              switchTab('properties');
            }
          }));
        }
      }

      function showMemberDialog(existing, parent) {
        const isEdit = !!existing;
        const node = existing || { name: '', attributes: [{ name: '性别', value: '男' }, { name: '出生日期', value: '' }, { name: '配偶',
            value: '' }, { name: '出生地', value: '' }, { name: '备注', value: '' }] };
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `<div class="modal-dialog"><div class="modal-header">${isEdit?'✏️ 编辑':'➕ 添加'}成员</div>
        <div class="modal-body">
          <div class="form-group"><label>姓名 *</label><input type="text" id="dName" value="${escapeHtml(node.name)}" style="width:100%;padding:8px;"></div>
          <div class="form-row" style="display:flex;gap:10px;"><div class="form-group" style="flex:1;"><label>性别</label><select id="dGender" style="width:100%;padding:8px;"><option value="男" ${getAttr(node,'性别')==='男'?'selected':''}>男</option><option value="女" ${getAttr(node,'性别')==='女'?'selected':''}>女</option></select></div><div class="form-group" style="flex:1;"><label>出生日期</label><input type="date" id="dBirth" value="${getAttr(node,'出生日期')}" style="width:100%;padding:8px;"></div></div>
          <div class="form-group"><label>配偶</label><input type="text" id="dSpouse" value="${escapeHtml(getAttr(node,'配偶'))}" style="width:100%;padding:8px;"></div>
          <div class="form-group"><label>出生地</label><input type="text" id="dPlace" value="${escapeHtml(getAttr(node,'出生地'))}" style="width:100%;padding:8px;"></div>
          <div class="form-group"><label>备注</label><input type="text" id="dNote" value="${escapeHtml(getAttr(node,'备注'))}" style="width:100%;padding:8px;"></div>
        </div>
        <div class="modal-footer"><button class="btn-cancel" id="dCancel">取消</button><button class="btn-primary" id="dOk">${isEdit?'保存':'添加'}</button></div></div>`;
        document.body.appendChild(overlay);
        const close = () => overlay.remove();
        overlay.querySelector('#dCancel').onclick = close;
        overlay.querySelector('#dOk').onclick = () => {
          const name = overlay.querySelector('#dName').value.trim();
          if (!name) { alert('请输入姓名'); return; }
          const birthDate = overlay.querySelector('#dBirth').value.trim();
          if (birthDate && !isDateValid(birthDate)) { alert('出生日期不能晚于今天，且格式需为YYYY-MM-DD'); return; }
          const attrs = [{ name: '性别', value: overlay.querySelector('#dGender').value }, { name: '出生日期', value: birthDate },
            { name: '配偶', value: overlay.querySelector('#dSpouse').value.trim() }, { name: '出生地', value: overlay
              .querySelector('#dPlace').value.trim() }, { name: '备注', value: overlay.querySelector('#dNote').value.trim() }
          ];
          if (isEdit) { existing.name = name;
            existing.attributes = attrs; } else { const newNode = { id: generateId(), name, attributes: attrs, children: [] };
            if (parent) { parent.children.push(newNode);
              expandedNodeIds.add(parent.id);
              selectedNodeId = newNode.id; } else { familyData.children.push(newNode);
              selectedNodeId = newNode.id; } }
          saveData();
          renderTree();
          refreshDetailView();
          close();
        };
        overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
      }

      function addChildMember(id) { const nid = id || selectedNodeId; if (!nid) return; const n = findNodeById(familyData, nid);
        if (!n) return;
        showMemberDialog(null, n); }

      function addSiblingMember(id) { const nid = id || selectedNodeId; if (!nid) return; const n = findNodeById(familyData,
          nid); if (!n || n.isRoot) return; const p = findParentNode(familyData, nid); if (!p) return;
        showMemberDialog(null, p); }

      function showContextMenu(x, y, node) { const menu = document.getElementById('contextMenu');
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        menu.classList.add('show'); }
      document.addEventListener('click', () => document.getElementById('contextMenu').classList.remove('show'));

      function expandAllNodes() {
        function c(n) { if (n.children && n.children.length) { expandedNodeIds.add(n.id);
            n.children.forEach(c); } }
        c(familyData);
        expandedNodeIds.add(familyData.id);
        renderTree();
      }

      function collapseAllNodes() { expandedNodeIds.clear();
        expandedNodeIds.add(familyData.id);
        renderTree(); }

      function exportData() { const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(familyData, null, 2)]));
        a.download = '族谱管理系统.json';
        a.click(); }

      function importData() { document.getElementById('fileInput').click(); }

      function handleFileImport(e) { const f = e.target.files[0]; if (!f) return; const r = new FileReader();
        r.onload = ev => { try { familyData = JSON.parse(ev.target.result); if (!familyData.isRoot) throw new Error();
            saveData();
            renderTree();
            switchTab('properties'); } catch (ex) { alert('文件格式错误'); } };
        r.readAsText(f); }

      function resetAllData() { if (confirm('重置所有数据？')) { familyData = createTestData();
          saveData();
          renderTree();
          switchTab('properties'); } }

      function showHelp() { alert(
          '族谱管理系统\n- 双击个人信息表格可编辑\n- 子女排序：工具栏"子女排序"\n- 导出完整图片\n- 快捷键：Delete删除，Ctrl+Z撤销\n- Alt+F/E/S 打开菜单\n- 搜索支持多关键字（空格分隔）\n- 自定义范围：上下0-9代，0表示查询人自己'); }

      function updateStatusBar() {
        if (selectedNodeId) {
          const node = findNodeById(familyData, selectedNodeId);
          if (node && !node.isRoot) {
            const path = getNodePath(node);
            document.getElementById('statusPath').textContent = path.join(' > ');
          } else {
            document.getElementById('statusPath').textContent = '族谱管理系统';
          }
        } else {
          document.getElementById('statusPath').textContent = '族谱管理系统';
        }
        document.getElementById('statusCount').textContent = '共 ' + countMembers(familyData) + ' 位成员';
      }

      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
        if (e.key === 'Delete') { e.preventDefault(); if (selectedNodeId && selectedNodeId !== familyData.id)
            deleteSelectedMember(); } else if (e.ctrlKey && e.key === 'z') { e.preventDefault(); const undoBtn = document
            .getElementById('undoDeleteBtn'); if (undoBtn) undoBtn.click(); } else if (e.altKey && e.key === 'f') { e
            .preventDefault();
          document.getElementById('dropdownFile').classList.toggle('show'); } else if (e.altKey && e.key === 'e') { e
            .preventDefault();
          document.getElementById('dropdownEdit').classList.toggle('show'); } else if (e.altKey && e.key === 's') { e
            .preventDefault();
          openSearchDialog(); }
      });

      function init() {
        loadData();
        expandedNodeIds.add(familyData.id);
        renderTree();
        updateStatusBar();
        document.querySelectorAll('.menu-item[data-menu]').forEach(item => {
          const dd = item.querySelector('.dropdown-menu');
          if (dd) {
            item.addEventListener('click', function(e) {
              e.stopPropagation();
              const wasOpen = dd.classList.contains('show');
              document.querySelectorAll('.dropdown-menu.show').forEach(m => m.classList.remove('show'));
              if (!wasOpen) dd.classList.add('show');
            });
            dd.addEventListener('click', function(e) {
              e.stopPropagation();
              dd.classList.remove('show');
            });
          }
        });
        document.addEventListener('click', function() {
          document.querySelectorAll('.dropdown-menu.show').forEach(m => m.classList.remove('show'));
        });
        updateViewModeButtons('full');
        updateZoomButtons();
        window.setViewMode = setViewMode;
        window.zoomIn = zoomIn;
        window.zoomOut = zoomOut;
        window.zoomToFit = zoomToFit;
        window.zoomReset = zoomReset;
        window.exportChartImage = exportChartImage;
        window.openSortDialog = openSortDialog;
        window.openSearchDialog = openSearchDialog;
      }
      init();
      window.addChildMember = addChildMember;
      window.addSiblingMember = addSiblingMember;
      window.deleteSelectedMember = deleteSelectedMember;
      window.addAttribute = addAttribute;
      window.deleteAttribute = deleteAttribute;
      window.expandAllNodes = expandAllNodes;
      window.collapseAllNodes = collapseAllNodes;
      window.exportData = exportData;
      window.importData = importData;
      window.resetAllData = resetAllData;
      window.showHelp = showHelp;
      window.handleFileImport = handleFileImport;
      window.switchTab = switchTab;
    })();
  </script>
